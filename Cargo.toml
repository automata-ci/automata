[workspace]
resolver = "3"
members = [
    "crates/automata-action",
    "crates/automata-action-cache-file",
    "crates/automata-action-github",
    "crates/automata",
    "crates/automata-auth",
    "crates/automata-blob",
    "crates/automata-blob-s3",
    "crates/automata-control",
    "crates/automata-control-plane",
    "crates/automata-core",
    "crates/automata-credential",
    "crates/automata-credential-github",
    "crates/automata-execution",
    "crates/automata-expression-github",
    "crates/automata-github",
    "crates/automata-github-runtime",
    "crates/automata-job-executor-github",
    "crates/automata-protocol",
    "crates/automata-protocol-protobuf",
    "crates/automata-results-github",
    "crates/automata-runner",
    "crates/automata-runner-auth",
    "crates/automata-runner-auth-postgres",
    "crates/automata-runner-control",
    "crates/automata-runner-crypto",
    "crates/automata-runner-journal",
    "crates/automata-runner-runtime",
    "crates/automata-runner-spool",
    "crates/automata-runner-transport",
    "crates/automata-sandbox-podman",
    "crates/automata-scm",
    "crates/automata-store",
    "crates/automata-ui-renderer",
    "crates/automata-workflow-github",
    "crates/automata-workflow-service",
]
default-members = [
    "crates/automata",
    "crates/automata-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Alexander Dzhoganov"]
license = "MIT"
repository = "https://github.com/GoNeuralAI/automata"

[workspace.dependencies]
anyhow = "1.0.99"
async-trait = "0.1.91"
aws-sdk-s3 = { version = "=1.141.0", default-features = false, features = ["behavior-version-latest", "http-1x", "rt-tokio"] }
aws-smithy-http-client = { version = "=1.2.0", default-features = false, features = ["rustls-ring"] }
automata-auth = { path = "crates/automata-auth", version = "0.1.0" }
automata-action = { path = "crates/automata-action", version = "0.1.0" }
automata-action-cache-file = { path = "crates/automata-action-cache-file", version = "0.1.0" }
automata-action-github = { path = "crates/automata-action-github", version = "0.1.0" }
automata-blob = { path = "crates/automata-blob", version = "0.1.0" }
automata-blob-s3 = { path = "crates/automata-blob-s3", version = "0.1.0" }
automata-control = { path = "crates/automata-control", version = "0.1.0" }
automata-control-plane = { path = "crates/automata-control-plane", version = "0.1.0" }
automata-core = { path = "crates/automata-core", version = "0.1.0" }
automata-credential = { path = "crates/automata-credential", version = "0.1.0" }
automata-credential-github = { path = "crates/automata-credential-github", version = "0.1.0" }
automata-execution = { path = "crates/automata-execution", version = "0.1.0" }
automata-expression-github = { path = "crates/automata-expression-github", version = "0.1.0" }
automata-github = { path = "crates/automata-github", version = "0.1.0" }
automata-github-runtime = { path = "crates/automata-github-runtime", version = "0.1.0" }
automata-job-executor-github = { path = "crates/automata-job-executor-github", version = "0.1.0" }
automata-protocol = { path = "crates/automata-protocol", version = "0.1.0" }
automata-protocol-protobuf = { path = "crates/automata-protocol-protobuf", version = "0.1.0" }
automata-results-github = { path = "crates/automata-results-github", version = "0.1.0" }
automata-runner-auth = { path = "crates/automata-runner-auth", version = "0.1.0" }
automata-runner-auth-postgres = { path = "crates/automata-runner-auth-postgres", version = "0.1.0" }
automata-runner-control = { path = "crates/automata-runner-control", version = "0.1.0" }
automata-runner-crypto = { path = "crates/automata-runner-crypto", version = "0.1.0" }
automata-runner-journal = { path = "crates/automata-runner-journal", version = "0.1.0" }
automata-runner-runtime = { path = "crates/automata-runner-runtime", version = "0.1.0" }
automata-runner-spool = { path = "crates/automata-runner-spool", version = "0.1.0" }
automata-runner-transport = { path = "crates/automata-runner-transport", version = "0.1.0" }
automata-sandbox-podman = { path = "crates/automata-sandbox-podman", version = "0.1.0" }
automata-scm = { path = "crates/automata-scm", version = "0.1.0" }
automata-store = { path = "crates/automata-store", version = "0.1.0" }
automata-ui-renderer = { path = "crates/automata-ui-renderer", version = "0.1.0" }
automata-workflow-github = { path = "crates/automata-workflow-github", version = "0.1.0" }
automata-workflow-service = { path = "crates/automata-workflow-service", version = "0.1.0" }
axum = { version = "0.8.4", features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
bytes = "=1.12.1"
clap = { version = "4.5.45", features = ["derive", "env"] }
futures = "0.3.31"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
getrandom = "0.3.3"
http = "1.3.1"
http-body-util = "=0.1.4"
hyper = { version = "=1.11.0", default-features = false, features = ["client", "http2", "server"] }
hyper-rustls = { version = "=0.27.9", default-features = false, features = ["http2", "ring", "tls12"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["client", "client-legacy", "http2", "server", "service", "tokio"] }
pem-rfc7468 = { version = "1.0.0", default-features = false, features = ["std"] }
reqwest = { version = "0.12.23", default-features = false, features = ["http2", "json", "rustls-tls-webpki-roots"] }
ring = { version = "=0.17.14", default-features = false, features = ["std"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
saphyr-parser = { version = "0.0.11", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
static_assertions = "1.1.0"
subtle = "2.6.1"
thiserror = "2.0.16"
time = { version = "0.3.55", default-features = false, features = ["parsing", "std"] }
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }
tower = { version = "0.5.2", features = ["timeout", "util"] }
tower-service = "=0.3.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.18.0", features = ["serde", "v4"] }
wasmtime = { version = "=47.0.3", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=47.0.3", default-features = false, features = ["p2"] }
xmlparser = "=0.13.6"
zeroize = { version = "1.8.1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
