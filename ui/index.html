<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Automata UI sample-data demo; no backend workflows are executed"
    />
    <title>Automata UI demo</title>
    <script>
      try {
        const theme = localStorage.getItem("automata-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
  </head>
  <body>
    <noscript>
      This sample-data demo requires JavaScript. Automata's production UI is
      server-rendered.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/preview.tsx"></script>
  </body>
</html>
