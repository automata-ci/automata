name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: automata-public-release
  cancel-in-progress: false

jobs:
  gate:
    name: Gate tagged commit
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      crates_io_initial_burst_override_approved: ${{ steps.capacity.outputs.initial_burst_override_approved }}
      crates_io_owner_logins: ${{ steps.capacity.outputs.owner_logins }}
      created: ${{ steps.identity.outputs.created }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      source_date_epoch: ${{ steps.identity.outputs.source_date_epoch }}
      tag: ${{ steps.identity.outputs.tag }}
      tag_object: ${{ steps.identity.outputs.tag_object }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out the release tag and main history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            expected_ref="refs/heads/${DEFAULT_BRANCH}"
            [[ "$DISPATCH_REF" == "$expected_ref" ]] || {
              printf 'error: manual release retries must run from %s\n' \
                "$expected_ref" >&2
              exit 1
            }
          elif [[ "$EVENT_NAME" == push ]]; then
            [[ "$DISPATCH_REF" == "refs/tags/${REQUESTED_TAG}" ]] || {
              printf 'error: tag release ref does not match %s\n' \
                "$REQUESTED_TAG" >&2
              exit 1
            }
          else
            printf 'error: unsupported release event: %s\n' "$EVENT_NAME" >&2
            exit 1
          fi

          version="$(./scripts/ci/workspace-version.sh)"
          [[ "$version" != *+* ]] || {
            printf 'error: release versions cannot contain SemVer build metadata: %s\n' \
              "$version" >&2
            exit 1
          }
          (( ${#version} <= 120 )) || {
            printf 'error: release version is too long for a safe OCI tag\n' >&2
            exit 1
          }
          [[ "$REQUESTED_TAG" == "v${version}" ]] || {
            printf 'error: tag %s does not match workspace version %s\n' \
              "$REQUESTED_TAG" "$version" >&2
            exit 1
          }
          mapfile -t changelog_headings < <(
            grep -F "## [${version}] - " CHANGELOG.md || true
          )
          (( ${#changelog_headings[@]} == 1 )) || {
            printf 'error: CHANGELOG.md must contain exactly one heading for %s\n' \
              "$version" >&2
            exit 1
          }
          release_date="${changelog_headings[0]#"## [${version}] - "}"
          if [[ ! "$release_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] ||
            [[ "$(date --date="$release_date" +%F 2>/dev/null)" != "$release_date" ]]; then
            printf 'error: changelog release date must be a valid YYYY-MM-DD date\n' >&2
            exit 1
          fi
          grep -Fx \
            "[Unreleased]: https://github.com/automata-ci/automata/compare/v${version}...HEAD" \
            CHANGELOG.md >/dev/null || {
            printf 'error: CHANGELOG.md lacks the post-release comparison link\n' >&2
            exit 1
          }
          grep -Fx \
            "[${version}]: https://github.com/automata-ci/automata/releases/tag/v${version}" \
            CHANGELOG.md >/dev/null || {
            printf 'error: CHANGELOG.md lacks the exact release link\n' >&2
            exit 1
          }
          git check-ref-format "refs/tags/${REQUESTED_TAG}" >/dev/null || {
            printf 'error: %s is not a valid tag name\n' "$REQUESTED_TAG" >&2
            exit 1
          }
          git show-ref --verify --quiet "refs/tags/${REQUESTED_TAG}" || {
            printf 'error: %s is not a fetched tag\n' "$REQUESTED_TAG" >&2
            exit 1
          }
          tag_object="$(git rev-parse --verify "refs/tags/${REQUESTED_TAG}")"
          [[ "$(git cat-file -t "$tag_object")" == tag ]] || {
            printf 'error: release tag %s must be annotated\n' \
              "$REQUESTED_TAG" >&2
            exit 1
          }
          commit="$(git rev-parse --verify 'HEAD^{commit}')"
          tagged_commit="$(
            git rev-parse --verify "refs/tags/${REQUESTED_TAG}^{commit}"
          )"
          [[ "$commit" == "$tagged_commit" ]] || {
            printf 'error: checked-out commit is not %s\n' "$REQUESTED_TAG" >&2
            exit 1
          }
          [[ -z "$(git status --porcelain)" ]] || {
            printf 'error: release checkout is dirty\n' >&2
            exit 1
          }
          source_date_epoch="$(git show -s --format=%ct "$commit")"
          created="$(git show -s --format=%cI "$commit")"
          {
            printf 'tag=%s\n' "$REQUESTED_TAG"
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$commit"
            printf 'created=%s\n' "$created"
            printf 'source_date_epoch=%s\n' "$source_date_epoch"
            printf 'tag_object=%s\n' "$tag_object"
            if [[ "$version" == *-* ]]; then
              printf 'prerelease=true\n'
            else
              printf 'prerelease=false\n'
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Require unambiguous release order
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ steps.identity.outputs.prerelease }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          release_state="$RUNNER_TEMP/github-releases.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$release_state"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            python3 scripts/ci/check-release-order.py \
              --requested-tag "$RELEASE_TAG" \
              --version "$RELEASE_VERSION" \
              --prerelease "$RELEASE_PRERELEASE" < "$release_state"

      - name: Require crates.io name ownership and first-publish capacity
        id: capacity
        env:
          CRATES_IO_EXPECTED_OWNER_LOGINS: ${{ vars.CRATES_IO_EXPECTED_OWNER_LOGINS }}
          CRATES_IO_INITIAL_BURST_OVERRIDE_APPROVED: ${{ vars.CRATES_IO_INITIAL_BURST_OVERRIDE_APPROVED }}
        run: |
          python3 scripts/ci/publish-crates.py --check-capacity
          {
            printf 'owner_logins=%s\n' "$CRATES_IO_EXPECTED_OWNER_LOGINS"
            printf 'initial_burst_override_approved=%s\n' \
              "${CRATES_IO_INITIAL_BURST_OVERRIDE_APPROVED:-false}"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful main CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          git show-ref --verify --quiet refs/remotes/origin/main || {
            printf 'error: origin/main was not fetched\n' >&2
            exit 1
          }
          git merge-base --is-ancestor \
            "$RELEASE_COMMIT" refs/remotes/origin/main || {
            printf 'error: release commit %s is not on main\n' \
              "$RELEASE_COMMIT" >&2
            exit 1
          }

          endpoint="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs"
          # CI's distribution job runs after its verification fan-out, so a
          # tag pushed with the main commit can legitimately take about 75
          # minutes to reach a terminal workflow conclusion.
          deadline="$(( $(date +%s) + 5400 ))"
          api_failures=0
          while (( $(date +%s) < deadline )); do
            if ! runs="$(
              gh api --method GET "$endpoint" \
                -f branch=main \
                -f event=push \
                -f head_sha="$RELEASE_COMMIT" \
                -f per_page=100 \
                --jq '.workflow_runs[] | [.id, .status, (.conclusion // ""), .html_url] | @tsv'
            )"; then
              api_failures="$((api_failures + 1))"
              if (( api_failures >= 3 )); then
                printf 'error: unable to query CI runs for %s\n' \
                  "$RELEASE_COMMIT" >&2
                exit 1
              fi
              printf 'warning: CI query failed; retrying (%s/3)\n' \
                "$api_failures" >&2
              sleep 15
              continue
            fi
            api_failures=0

            success_url=""
            failed_url=""
            pending=false
            while IFS=$'\t' read -r run_id status conclusion run_url; do
              [[ -n "$run_id" ]] || continue
              if [[ "$status" == completed && "$conclusion" == success ]]; then
                success_url="$run_url"
                break
              fi
              if [[ "$status" == completed ]]; then
                failed_url="$run_url"
              else
                pending=true
              fi
            done <<< "$runs"

            if [[ -n "$success_url" ]]; then
              printf 'Release gate accepted CI run: %s\n' "$success_url"
              break
            fi
            if [[ -n "$failed_url" && "$pending" == false ]]; then
              printf 'error: CI did not pass for release commit %s: %s\n' \
                "$RELEASE_COMMIT" "$failed_url" >&2
              exit 1
            fi
            printf 'Waiting for main CI on %s...\n' "$RELEASE_COMMIT"
            sleep 15
          done
          [[ -n "${success_url:-}" ]] || {
            printf 'error: timed out waiting for main CI on %s\n' \
              "$RELEASE_COMMIT" >&2
            exit 1
          }

  stage_release:
    name: Stage release payloads
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: release
    outputs:
      automata_digest: ${{ steps.images.outputs.automata_digest }}
      handoff_artifact_digest: ${{ steps.upload-handoff.outputs.artifact-digest }}
      handoff_artifact_id: ${{ steps.upload-handoff.outputs.artifact-id }}
      handoff_filename: ${{ steps.handoff.outputs.handoff_filename }}
      handoff_sha256: ${{ steps.handoff.outputs.handoff_sha256 }}
      manifest_sha256: ${{ steps.handoff.outputs.manifest_sha256 }}
      runner_digest: ${{ steps.images.outputs.runner_digest }}
      service_proxy_candidate_artifact_digest: ${{ steps.upload-service-proxy.outputs.artifact-digest }}
      service_proxy_candidate_artifact_id: ${{ steps.upload-service-proxy.outputs.artifact-id }}
      service_proxy_candidate_filename: ${{ steps.service-proxy-candidate.outputs.candidate_filename }}
      service_proxy_candidate_sha256: ${{ steps.service-proxy-candidate.outputs.candidate_sha256 }}
      service_proxy_image_digest: ${{ steps.service-proxy-candidate.outputs.image_digest }}
      service_proxy_provenance_sha256: ${{ steps.service-proxy-candidate.outputs.provenance_sha256 }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      ATTESTATION_HOME: ${{ github.workspace }}/target/task-tmp/release/attestation-home
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      DOCKER_CONFIG: ${{ github.workspace }}/target/task-tmp/release/attestation-home/.docker
      RUST_BACKTRACE: "1"
      TMPDIR: ${{ github.workspace }}/target/task-tmp/release
    steps:
      - name: Check out the gated release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.gate.outputs.tag }}

      - name: Bind the release build to the gated commit
        env:
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.source_date_epoch }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          local_tag_object="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}")"
          [[ "$local_tag_object" == "$RELEASE_TAG_OBJECT" ]] || {
            printf 'error: release tag object changed after the release gate\n' >&2
            exit 1
          }
          commit="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$commit" == "$RELEASE_COMMIT" ]] || {
            printf 'error: tag %s moved after the release gate\n' \
              "$RELEASE_TAG" >&2
            exit 1
          }
          [[ "$(./scripts/ci/workspace-version.sh)" == "$RELEASE_VERSION" ]] || {
            printf 'error: gated workspace version changed\n' >&2
            exit 1
          }
          [[ "$RELEASE_VERSION" != *+* ]] || {
            printf 'error: release versions cannot contain SemVer build metadata\n' >&2
            exit 1
          }
          [[ -z "$(git status --porcelain)" ]] || {
            printf 'error: release checkout is dirty\n' >&2
            exit 1
          }
          {
            printf 'AUTOMATA_BUILD_GIT_SHA=%s\n' "$commit"
            printf 'AUTOMATA_EXPECTED_GIT_SHA=%s\n' "$commit"
            printf 'AUTOMATA_EXPECTED_VERSION=%s\n' "$RELEASE_VERSION"
            printf 'AUTOMATA_RELEASE_BUILD=1\n'
            printf 'SOURCE_DATE_EPOCH=%s\n' "$RELEASE_SOURCE_DATE_EPOCH"
          } >> "$GITHUB_ENV"

      - name: Install release build dependencies
        run: |
          install -d -m 0700 -- "$TMPDIR" "$ATTESTATION_HOME" "$DOCKER_CONFIG"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils musl-tools podman

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install pinned SBOM generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Verify crates.io packages
        run: |
          mapfile -t publishable_crates < <(
            python3 scripts/ci/publish-crates.py --list-publishable
          )
          package_arguments=()
          for crate in "${publishable_crates[@]}"; do
            package_arguments+=(--package "$crate")
          done
          (( ${#package_arguments[@]} > 0 ))
          cargo package --locked "${package_arguments[@]}"

      - name: Build and verify static executables
        run: |
          ./scripts/ci/build-static-musl.sh
          AUTOMATA_SCRATCH_RUNTIME=docker ./scripts/ci/verify-static-musl.sh
          ./scripts/ci/verify-service-proxy-static.sh

      - name: Generate release metadata
        run: |
          ./scripts/ci/generate-sboms.sh
          ./scripts/ci/prepare-third-party-license-sources.sh
          ./scripts/ci/generate-third-party-licenses.sh
          ./scripts/ci/package-static-musl.sh

      - name: Prepare digest-bound private service-proxy image candidate
        id: service-proxy-candidate
        env:
          AUTOMATA_SERVICE_PROXY_CONTAINER_RUNTIME: podman
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_CREATED: ${{ needs.gate.outputs.created }}
          RELEASE_SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.source_date_epoch }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          ./scripts/ci/prepare-service-proxy-context.sh \
            target/service-proxy-context \
            "$RELEASE_VERSION" \
            "$RELEASE_COMMIT" \
            "$RELEASE_CREATED" \
            "$RELEASE_SOURCE_DATE_EPOCH"
          ./scripts/ci/build-service-proxy-candidate.sh \
            target/service-proxy-context \
            target/service-proxy-publication

      - name: Require complete private service-proxy candidate evidence
        env:
          CANDIDATE_FILENAME: ${{ steps.service-proxy-candidate.outputs.candidate_filename }}
          CANDIDATE_SHA256: ${{ steps.service-proxy-candidate.outputs.candidate_sha256 }}
          IMAGE_DIGEST: ${{ steps.service-proxy-candidate.outputs.image_digest }}
          PROVENANCE_SHA256: ${{ steps.service-proxy-candidate.outputs.provenance_sha256 }}
        run: |
          [[ "$CANDIDATE_FILENAME" == \
            automata-service-proxy-candidate-x86_64-unknown-linux-musl.tar ]] || {
            printf 'error: private service-proxy candidate filename differs\n' >&2
            exit 1
          }
          [[ "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            printf 'error: private service-proxy candidate digest is invalid\n' >&2
            exit 1
          }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'error: private service-proxy image digest is invalid\n' >&2
            exit 1
          }
          [[ "$PROVENANCE_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            printf 'error: private service-proxy provenance digest is invalid\n' >&2
            exit 1
          }
          actual="$(sha256sum \
            "target/service-proxy-publication/${CANDIDATE_FILENAME}" | awk '{print $1}')"
          [[ "$actual" == "$CANDIDATE_SHA256" ]] || {
            printf 'error: private service-proxy candidate bytes changed\n' >&2
            exit 1
          }

      - name: Revalidate identity before the first staging mutation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          remote_refs="$(
            env -u CARGO_REGISTRY_TOKEN -u GH_TOKEN -u GITHUB_TOKEN \
              git ls-remote --exit-code origin \
                "refs/tags/${RELEASE_TAG}" \
                "refs/tags/${RELEASE_TAG}^{}"
          )"
          direct=''
          peeled=''
          while IFS=$'\t' read -r object reference; do
            case "$reference" in
              "refs/tags/${RELEASE_TAG}") direct="$object" ;;
              "refs/tags/${RELEASE_TAG}^{}") peeled="$object" ;;
            esac
          done <<< "$remote_refs"
          [[ "$direct" == "$RELEASE_TAG_OBJECT" && \
            "$peeled" == "$RELEASE_COMMIT" ]] || {
            printf 'error: release tag changed during staging\n' >&2
            exit 1
          }
          release_state="$RUNNER_TEMP/github-releases-before-draft.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$release_state"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            python3 scripts/ci/check-release-order.py \
              --requested-tag "$RELEASE_TAG" \
              --version "$RELEASE_VERSION" \
              --prerelease "$RELEASE_PRERELEASE" < "$release_state"

      - name: Create or update draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          archive="target/distribution/automata-x86_64-unknown-linux-musl.tar.gz"
          checksum="${archive}.sha256"
          manifest="target/distribution/automata-release-manifest.json"
          archive_name="${archive##*/}"
          checksum_name="${checksum##*/}"
          manifest_name="${manifest##*/}"
          prerelease_args=()
          case "$RELEASE_PRERELEASE" in
            true) prerelease_args=(--prerelease) ;;
            false) ;;
            *)
              printf 'error: invalid prerelease gate output\n' >&2
              exit 1
              ;;
          esac

          require_recoverable_draft_assets() {
            gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets |
              env -u GH_TOKEN -u GITHUB_TOKEN python3 -c '
          import json
          import sys

          release = json.load(sys.stdin)
          if release.get("isDraft") is not True:
              raise SystemExit("release is already published and immutable")
          expected_prerelease = sys.argv[1] == "true"
          if release.get("isPrerelease") is not expected_prerelease:
              raise SystemExit("draft release prerelease state differs")
          actual = [asset.get("name") for asset in release.get("assets", [])]
          if any(not isinstance(name, str) for name in actual):
              raise SystemExit("draft release contains an invalid asset name")
          expected = set(sys.argv[2:])
          unexpected = sorted(set(actual) - expected)
          if len(actual) != len(set(actual)):
              raise SystemExit("draft release contains duplicate asset names")
          if unexpected:
              raise SystemExit(
                  f"draft release contains unexpected assets: {unexpected!r}"
              )
          ' "$RELEASE_PRERELEASE" \
            "$archive_name" "$checksum_name" "$manifest_name"
          }

          require_base_draft_assets() {
            gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets |
              env -u GH_TOKEN -u GITHUB_TOKEN python3 -c '
          import json
          import sys

          release = json.load(sys.stdin)
          if release.get("isDraft") is not True:
              raise SystemExit("release is already published and immutable")
          expected_prerelease = sys.argv[1] == "true"
          if release.get("isPrerelease") is not expected_prerelease:
              raise SystemExit("draft release prerelease state differs")
          actual = {asset.get("name") for asset in release.get("assets", [])}
          required = set(sys.argv[2:4])
          allowed = set(sys.argv[2:])
          if not required.issubset(actual) or not actual.issubset(allowed):
              raise SystemExit(
                  f"draft release assets are not recoverable: {sorted(actual)!r}"
              )
          ' "$RELEASE_PRERELEASE" \
            "$archive_name" "$checksum_name" "$manifest_name"
          }

          verify_remote_release_assets() (
            verification_directory="$(
              env -u GH_TOKEN -u GITHUB_TOKEN \
                mktemp -d "${TMPDIR%/}/release-assets.XXXXXXXX"
            )"
            trap 'env -u GH_TOKEN -u GITHUB_TOKEN rm -rf -- "$verification_directory"' EXIT
            gh release download "$RELEASE_TAG" \
              --dir "$verification_directory" \
              --pattern "$archive_name" \
              --pattern "$checksum_name"
            env -u GH_TOKEN -u GITHUB_TOKEN \
              cmp -- "$archive" "$verification_directory/$archive_name"
            env -u GH_TOKEN -u GITHUB_TOKEN \
              cmp -- "$checksum" "$verification_directory/$checksum_name"
            (
              cd -- "$verification_directory"
              env -u GH_TOKEN -u GITHUB_TOKEN \
                sha256sum --check --strict "$checksum_name"
            )
          )

          verify_remote_release_asset() (
            expected_path="$1"
            asset_name="${expected_path##*/}"
            verification_directory="$(
              env -u GH_TOKEN -u GITHUB_TOKEN \
                mktemp -d "${TMPDIR%/}/release-asset.XXXXXXXX"
            )"
            trap 'env -u GH_TOKEN -u GITHUB_TOKEN rm -rf -- "$verification_directory"' EXIT
            gh release download "$RELEASE_TAG" \
              --dir "$verification_directory" \
              --pattern "$asset_name"
            env -u GH_TOKEN -u GITHUB_TOKEN \
              cmp -- "$expected_path" "$verification_directory/$asset_name"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            require_recoverable_draft_assets
            assets_file="$RUNNER_TEMP/existing-draft-assets.txt"
            gh release view "$RELEASE_TAG" --json assets \
              --jq '.assets[].name' > "$assets_file"
            mapfile -t existing_assets < "$assets_file"
            manifest_present=false
            missing_assets=()
            for expected_path in "$archive" "$checksum"; do
              asset_name="${expected_path##*/}"
              present=false
              for existing_asset in "${existing_assets[@]}"; do
                if [[ "$existing_asset" == "$asset_name" ]]; then
                  present=true
                  break
                fi
              done
              if [[ "$present" == true ]]; then
                verify_remote_release_asset "$expected_path"
              else
                missing_assets+=("$expected_path")
              fi
            done
            if (( ${#missing_assets[@]} > 0 )); then
              gh release upload "$RELEASE_TAG" "${missing_assets[@]}"
            fi
            for existing_asset in "${existing_assets[@]}"; do
              if [[ "$existing_asset" == "$manifest_name" ]]; then
                manifest_present=true
              fi
            done
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --generate-notes \
              "${prerelease_args[@]}" \
              --title "Automata ${RELEASE_VERSION}" \
              --verify-tag \
              "$archive" "$checksum"
            manifest_present=false
          fi
          require_base_draft_assets
          verify_remote_release_assets
          printf 'manifest_present=%s\n' "$manifest_present" >> "$GITHUB_OUTPUT"

      - name: Attest accepted release archive bytes
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            target/distribution/automata-x86_64-unknown-linux-musl.tar.gz
            target/distribution/automata-x86_64-unknown-linux-musl.tar.gz.sha256

      - name: Attest unpublished service-proxy candidate bytes
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: target/service-proxy-publication/${{ steps.service-proxy-candidate.outputs.candidate_filename }}

      - name: Recover immutable image binding from the draft
        id: recovered
        if: ${{ steps.draft.outputs.manifest_present == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_CREATED: ${{ needs.gate.outputs.created }}
          RELEASE_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          RELEASE_SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.source_date_epoch }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          gh release download "$RELEASE_TAG" \
            --dir target/distribution \
            --pattern automata-release-manifest.json
          env -u GH_TOKEN -u GITHUB_TOKEN \
            python3 scripts/ci/release-handoff.py verify-manifest \
              --repository-root . \
              --manifest target/distribution/automata-release-manifest.json \
              --tag "$RELEASE_TAG" \
              --tag-object "$RELEASE_TAG_OBJECT" \
              --commit "$RELEASE_COMMIT" \
              --version "$RELEASE_VERSION" \
              --prerelease "$RELEASE_PRERELEASE" \
              --source-date-epoch "$RELEASE_SOURCE_DATE_EPOCH" \
              --created "$RELEASE_CREATED" \
              --github-output "$GITHUB_OUTPUT"
          printf 'present=true\n' >> "$GITHUB_OUTPUT"

      - name: Prepare and verify image build context
        env:
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          ./scripts/ci/prepare-container-context.sh \
            target/distribution/automata-x86_64-unknown-linux-musl.tar.gz \
            target/container-release \
            "$RELEASE_VERSION"

      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Refuse unbound version image tags
        if: ${{ steps.draft.outputs.manifest_present != 'true' }}
        env:
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          require_absent_tag() {
            local image="$1"
            local error_file="$RUNNER_TEMP/image-inspect-error.txt"
            if docker buildx imagetools inspect \
              "${image}:${RELEASE_VERSION}" --raw >/dev/null 2>"$error_file"; then
              printf 'error: unbound version image tag already exists: %s:%s\n' \
                "$image" "$RELEASE_VERSION" >&2
              return 1
            fi
            if ! grep -Eiq 'manifest unknown|not found|no such manifest' "$error_file"; then
              printf 'error: could not prove version image tag is absent: %s:%s\n' \
                "$image" "$RELEASE_VERSION" >&2
              return 1
            fi
          }
          require_absent_tag ghcr.io/automata-ci/automata
          require_absent_tag ghcr.io/automata-ci/automata-runner

      - name: Build and publish Automata image
        id: automata-image
        if: ${{ steps.draft.outputs.manifest_present != 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: target/container-release
          file: deploy/container/automata.Containerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/automata-ci/automata,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            AUTOMATA_CREATED=${{ needs.gate.outputs.created }}
            AUTOMATA_REVISION=${{ needs.gate.outputs.commit }}
            AUTOMATA_VERSION=${{ needs.gate.outputs.version }}
            SOURCE_DATE_EPOCH=${{ needs.gate.outputs.source_date_epoch }}
          provenance: mode=max
          sbom: true

      - name: Build and publish runner image
        id: runner-image
        if: ${{ steps.draft.outputs.manifest_present != 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: target/container-release
          file: deploy/container/automata-runner.Containerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/automata-ci/automata-runner,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            AUTOMATA_CREATED=${{ needs.gate.outputs.created }}
            AUTOMATA_REVISION=${{ needs.gate.outputs.commit }}
            AUTOMATA_VERSION=${{ needs.gate.outputs.version }}
            SOURCE_DATE_EPOCH=${{ needs.gate.outputs.source_date_epoch }}
          provenance: mode=max
          sbom: true

      - name: Select immutable image digests
        id: images
        env:
          AUTOMATA_DIGEST: ${{ steps.recovered.outputs.automata_digest || steps.automata-image.outputs.digest }}
          RUNNER_DIGEST: ${{ steps.recovered.outputs.runner_digest || steps.runner-image.outputs.digest }}
        run: |
          [[ "$AUTOMATA_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'error: invalid Automata image digest: %s\n' \
              "$AUTOMATA_DIGEST" >&2
            exit 1
          }
          [[ "$RUNNER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'error: invalid runner image digest: %s\n' \
              "$RUNNER_DIGEST" >&2
            exit 1
          }
          {
            printf 'automata_digest=%s\n' "$AUTOMATA_DIGEST"
            printf 'runner_digest=%s\n' "$RUNNER_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Create immutable cross-job handoff
        id: handoff
        env:
          AUTOMATA_DIGEST: ${{ steps.images.outputs.automata_digest }}
          MANIFEST_PRESENT: ${{ steps.draft.outputs.manifest_present }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_CREATED: ${{ needs.gate.outputs.created }}
          RELEASE_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          RELEASE_SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.source_date_epoch }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          RUNNER_DIGEST: ${{ steps.images.outputs.runner_digest }}
        run: |
          handoff="target/release-handoff/automata-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          common=(
            --repository-root .
            --manifest target/distribution/automata-release-manifest.json
            --handoff "$handoff"
            --tag "$RELEASE_TAG"
            --tag-object "$RELEASE_TAG_OBJECT"
            --commit "$RELEASE_COMMIT"
            --version "$RELEASE_VERSION"
            --prerelease "$RELEASE_PRERELEASE"
            --source-date-epoch "$RELEASE_SOURCE_DATE_EPOCH"
            --created "$RELEASE_CREATED"
            --github-output "$GITHUB_OUTPUT"
          )
          mapfile -t publishable_crates < <(
            python3 scripts/ci/publish-crates.py --list-publishable
          )
          (( ${#publishable_crates[@]} > 0 )) || {
            printf 'error: no publishable workspace crates were found\n' >&2
            exit 1
          }
          for crate in "${publishable_crates[@]}"; do
            common+=(--expected-crate "$crate")
          done
          if [[ "$MANIFEST_PRESENT" == true ]]; then
            python3 scripts/ci/release-handoff.py pack "${common[@]}"
          else
            python3 scripts/ci/release-handoff.py create \
              "${common[@]}" \
              --automata-digest "$AUTOMATA_DIGEST" \
              --runner-digest "$RUNNER_DIGEST"
          fi

      - name: Revalidate identity before the immutable image binding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          remote_refs="$(
            env -u CARGO_REGISTRY_TOKEN -u GH_TOKEN -u GITHUB_TOKEN \
              git ls-remote --exit-code origin \
                "refs/tags/${RELEASE_TAG}" \
                "refs/tags/${RELEASE_TAG}^{}"
          )"
          direct=''
          peeled=''
          while IFS=$'\t' read -r object reference; do
            case "$reference" in
              "refs/tags/${RELEASE_TAG}") direct="$object" ;;
              "refs/tags/${RELEASE_TAG}^{}") peeled="$object" ;;
            esac
          done <<< "$remote_refs"
          [[ "$direct" == "$RELEASE_TAG_OBJECT" && \
            "$peeled" == "$RELEASE_COMMIT" ]] || {
            printf 'error: release tag changed before immutable binding\n' >&2
            exit 1
          }
          release_state="$RUNNER_TEMP/github-releases-before-binding.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$release_state"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            python3 scripts/ci/check-release-order.py \
              --requested-tag "$RELEASE_TAG" \
              --version "$RELEASE_VERSION" \
              --prerelease "$RELEASE_PRERELEASE" < "$release_state"

      - name: Bind new image digests in the draft manifest
        if: ${{ steps.draft.outputs.manifest_present != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            target/distribution/automata-release-manifest.json

      - name: Verify exact draft release binding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: |
          archive="target/distribution/automata-x86_64-unknown-linux-musl.tar.gz"
          checksum="${archive}.sha256"
          manifest="target/distribution/automata-release-manifest.json"
          verification_directory="$(mktemp -d "${TMPDIR%/}/bound-assets.XXXXXXXX")"
          trap 'env -u GH_TOKEN -u GITHUB_TOKEN rm -rf -- "$verification_directory"' EXIT
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets |
            env -u GH_TOKEN -u GITHUB_TOKEN python3 -c '
          import json
          import sys
          release = json.load(sys.stdin)
          if release.get("isDraft") is not True:
              raise SystemExit("release is already published and immutable")
          expected_prerelease = sys.argv[1] == "true"
          if release.get("isPrerelease") is not expected_prerelease:
              raise SystemExit("draft release prerelease state differs")
          actual = sorted(asset.get("name") for asset in release.get("assets", []))
          expected = sorted(sys.argv[2:])
          if actual != expected:
              raise SystemExit(f"draft release assets differ: {actual!r}")
          ' "$RELEASE_PRERELEASE" \
            "${archive##*/}" "${checksum##*/}" "${manifest##*/}"
          gh release download "$RELEASE_TAG" \
            --dir "$verification_directory" \
            --pattern "${archive##*/}" \
            --pattern "${checksum##*/}" \
            --pattern "${manifest##*/}"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            cmp -- "$archive" "$verification_directory/${archive##*/}"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            cmp -- "$checksum" "$verification_directory/${checksum##*/}"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            cmp -- "$manifest" "$verification_directory/${manifest##*/}"

      - name: Create or verify immutable version image tags
        env:
          AUTOMATA_DIGEST: ${{ steps.images.outputs.automata_digest }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          RUNNER_DIGEST: ${{ steps.images.outputs.runner_digest }}
        run: |
          bind_version_tag() {
            local image="$1"
            local digest="$2"
            local error_file="$RUNNER_TEMP/image-tag-error.txt"
            local raw_file="$RUNNER_TEMP/image-tag-raw.json"
            if docker buildx imagetools inspect \
              "${image}:${RELEASE_VERSION}" --raw >"$raw_file" 2>"$error_file"; then
              actual="sha256:$(sha256sum "$raw_file" | awk '{print $1}')"
              [[ "$actual" == "$digest" ]] || {
                printf 'error: immutable version tag mismatch for %s:%s\n' \
                  "$image" "$RELEASE_VERSION" >&2
                return 1
              }
              return
            fi
            grep -Eiq 'manifest unknown|not found|no such manifest' "$error_file" || {
              printf 'error: could not inspect version tag for %s\n' "$image" >&2
              return 1
            }
            docker buildx imagetools create \
              --tag "${image}:${RELEASE_VERSION}" \
              "${image}@${digest}"
            docker buildx imagetools inspect \
              "${image}:${RELEASE_VERSION}" --raw >"$raw_file"
            actual="sha256:$(sha256sum "$raw_file" | awk '{print $1}')"
            [[ "$actual" == "$digest" ]] || {
              printf 'error: created version tag differs for %s\n' "$image" >&2
              return 1
            }
          }
          bind_version_tag ghcr.io/automata-ci/automata "$AUTOMATA_DIGEST"
          bind_version_tag ghcr.io/automata-ci/automata-runner "$RUNNER_DIGEST"

      - name: Attest Automata image provenance
        env:
          HOME: ${{ env.ATTESTATION_HOME }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/automata-ci/automata
          subject-digest: ${{ steps.images.outputs.automata_digest }}
          subject-version: ${{ needs.gate.outputs.version }}
          push-to-registry: true

      - name: Attest Automata image SBOM
        env:
          HOME: ${{ env.ATTESTATION_HOME }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/automata-ci/automata
          subject-digest: ${{ steps.images.outputs.automata_digest }}
          subject-version: ${{ needs.gate.outputs.version }}
          sbom-path: target/container-release/sbom/automata.cdx.json
          push-to-registry: true

      - name: Attest runner image provenance
        env:
          HOME: ${{ env.ATTESTATION_HOME }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/automata-ci/automata-runner
          subject-digest: ${{ steps.images.outputs.runner_digest }}
          subject-version: ${{ needs.gate.outputs.version }}
          push-to-registry: true

      - name: Attest runner image SBOM
        env:
          HOME: ${{ env.ATTESTATION_HOME }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/automata-ci/automata-runner
          subject-digest: ${{ steps.images.outputs.runner_digest }}
          subject-version: ${{ needs.gate.outputs.version }}
          sbom-path: target/container-release/sbom/automata-runner.cdx.json
          push-to-registry: true

      - name: Verify anonymous versioned GHCR images
        env:
          AUTOMATA_DIGEST: ${{ steps.images.outputs.automata_digest }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          RUNNER_DIGEST: ${{ steps.images.outputs.runner_digest }}
        run: |
          docker logout ghcr.io

          verify_image() {
            local image="$1"
            local expected_digest="$2"
            local tag="$3"
            local actual_digest
            actual_digest="sha256:$(
              docker buildx imagetools inspect "${image}:${tag}" --raw |
                sha256sum |
                awk '{print $1}'
            )" || {
              printf 'error: make the GHCR package %s public, then rerun the release\n' \
                "$image" >&2
              return 1
            }
            [[ "$actual_digest" == "$expected_digest" ]] || {
              printf 'error: %s:%s resolved to %s, expected %s\n' \
                "$image" "$tag" "$actual_digest" "$expected_digest" >&2
              return 1
            }
            docker buildx imagetools inspect \
              "${image}@${expected_digest}" >/dev/null
          }

          verify_image \
            ghcr.io/automata-ci/automata \
            "$AUTOMATA_DIGEST" \
            "$RELEASE_VERSION"
          verify_image \
            ghcr.io/automata-ci/automata-runner \
            "$RUNNER_DIGEST" \
            "$RELEASE_VERSION"

      - name: Upload raw immutable release handoff
        id: upload-handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          if-no-files-found: error
          path: target/release-handoff/${{ steps.handoff.outputs.handoff_filename }}
          retention-days: 90

      - name: Upload raw unpublished service-proxy candidate
        id: upload-service-proxy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          if-no-files-found: error
          name: automata-service-proxy-candidate-x86_64-unknown-linux-musl
          path: target/service-proxy-publication/${{ steps.service-proxy-candidate.outputs.candidate_filename }}
          retention-days: 90

      - name: Verify uploaded service-proxy candidate identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload-service-proxy.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload-service-proxy.outputs.artifact-id }}
          CANDIDATE_SHA256: ${{ steps.service-proxy-candidate.outputs.candidate_sha256 }}
        run: |
          artifact_digest="${ARTIFACT_DIGEST#sha256:}"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
            printf 'error: service-proxy upload returned an invalid artifact ID\n' >&2
            exit 1
          }
          [[ "$artifact_digest" == "$CANDIDATE_SHA256" ]] || {
            printf 'error: service-proxy artifact digest differs from candidate bytes\n' >&2
            exit 1
          }

      - name: Verify uploaded handoff identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload-handoff.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload-handoff.outputs.artifact-id }}
          HANDOFF_SHA256: ${{ steps.handoff.outputs.handoff_sha256 }}
        run: |
          artifact_digest="${ARTIFACT_DIGEST#sha256:}"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
            printf 'error: upload action returned an invalid artifact ID\n' >&2
            exit 1
          }
          [[ "$artifact_digest" == "$HANDOFF_SHA256" ]] || {
            printf 'error: artifact service digest differs from the raw handoff\n' >&2
            exit 1
          }

      - name: Sign out of GHCR after staging
        if: ${{ always() }}
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -f -- "$DOCKER_CONFIG/config.json"

  prepare_crates:
    name: Prepare crates.io publication
    needs: [gate, stage_release]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      plan_artifact_digest: ${{ steps.upload-plan.outputs.artifact-digest }}
      plan_artifact_id: ${{ steps.upload-plan.outputs.artifact-id }}
      plan_sha256: ${{ steps.prepare.outputs.plan_sha256 }}
      publish_required: ${{ steps.prepare.outputs.publish_required }}
      tools_artifact_digest: ${{ steps.upload-tools.outputs.artifact-digest }}
      tools_artifact_id: ${{ steps.upload-tools.outputs.artifact-id }}
      tools_filename: ${{ steps.publisher-tools.outputs.tools_filename }}
      tools_sha256: ${{ steps.publisher-tools.outputs.tools_sha256 }}
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.source_date_epoch }}
      TMPDIR: ${{ github.workspace }}/target/task-tmp/release-crates
    steps:
      - name: Check out the gated release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.gate.outputs.tag }}

      - name: Revalidate annotated remote release tag
        env:
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          local_object="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}")"
          local_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$local_object" == "$RELEASE_TAG_OBJECT" && \
            "$local_commit" == "$RELEASE_COMMIT" ]] || {
            printf 'error: local release tag identity differs from the gate\n' >&2
            exit 1
          }
          [[ "$(./scripts/ci/workspace-version.sh)" == "$RELEASE_VERSION" ]] || {
            printf 'error: workspace version differs from the release gate\n' >&2
            exit 1
          }
          remote_refs="$(
            env -u CARGO_REGISTRY_TOKEN -u GH_TOKEN -u GITHUB_TOKEN \
              git ls-remote --exit-code origin \
                "refs/tags/${RELEASE_TAG}" \
                "refs/tags/${RELEASE_TAG}^{}"
          )"
          direct=''
          peeled=''
          while IFS=$'\t' read -r object reference; do
            case "$reference" in
              "refs/tags/${RELEASE_TAG}") direct="$object" ;;
              "refs/tags/${RELEASE_TAG}^{}") peeled="$object" ;;
            esac
          done <<< "$remote_refs"
          [[ "$direct" == "$RELEASE_TAG_OBJECT" && \
            "$peeled" == "$RELEASE_COMMIT" ]] || {
            printf 'error: remote annotated release tag changed identity\n' >&2
            exit 1
          }

      - name: Download same-run raw handoff by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.stage_release.outputs.handoff_artifact_id }}
          digest-mismatch: error
          path: target/release-handoff-download
          skip-decompress: true

      - name: Verify and extract immutable handoff
        env:
          ARTIFACT_DIGEST: ${{ needs.stage_release.outputs.handoff_artifact_digest }}
          EXPECTED_FILENAME: ${{ needs.stage_release.outputs.handoff_filename }}
          HANDOFF_SHA256: ${{ needs.stage_release.outputs.handoff_sha256 }}
          MANIFEST_SHA256: ${{ needs.stage_release.outputs.manifest_sha256 }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_CREATED: ${{ needs.gate.outputs.created }}
          RELEASE_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          RELEASE_SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.source_date_epoch }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          artifact_digest="${ARTIFACT_DIGEST#sha256:}"
          [[ "$artifact_digest" == "$HANDOFF_SHA256" ]] || {
            printf 'error: artifact-service and handoff digests differ\n' >&2
            exit 1
          }
          [[ "$EXPECTED_FILENAME" =~ ^automata-release-[0-9]+-[0-9]+\.tar$ ]] || {
            printf 'error: unsafe handoff filename\n' >&2
            exit 1
          }
          handoff="target/release-handoff-download/${EXPECTED_FILENAME}"
          mapfile -d '' -t downloaded < <(
            find target/release-handoff-download -mindepth 1 -maxdepth 1 \
              -print0
          )
          if (( ${#downloaded[@]} != 1 )) || \
            ! [[ "${downloaded[0]}" == "$handoff" && \
              -f "$handoff" && ! -L "$handoff" ]]; then
            printf 'error: handoff download contains an unexpected entry set\n' >&2
            exit 1
          fi
          python3 scripts/ci/release-handoff.py verify-handoff \
            --handoff "$handoff" \
            --handoff-sha256 "$HANDOFF_SHA256" \
            --automata-digest "${{ needs.stage_release.outputs.automata_digest }}" \
            --runner-digest "${{ needs.stage_release.outputs.runner_digest }}" \
            --extract-root . \
            --tag "$RELEASE_TAG" \
            --tag-object "$RELEASE_TAG_OBJECT" \
            --commit "$RELEASE_COMMIT" \
            --version "$RELEASE_VERSION" \
            --prerelease "$RELEASE_PRERELEASE" \
            --source-date-epoch "$RELEASE_SOURCE_DATE_EPOCH" \
            --created "$RELEASE_CREATED" \
            --github-output "$RUNNER_TEMP/verified-handoff-outputs"
          grep -Fx "manifest_sha256=${MANIFEST_SHA256}" \
            "$RUNNER_TEMP/verified-handoff-outputs" >/dev/null

      - name: Repackage handoff crates before external revalidation
        run: |
          mapfile -t publishable_crates < <(
            python3 scripts/ci/publish-crates.py --list-publishable
          )
          package_arguments=()
          for crate in "${publishable_crates[@]}"; do
            package_arguments+=(--package "$crate")
          done
          (( ${#package_arguments[@]} > 0 ))
          cargo package --locked --no-verify "${package_arguments[@]}"

      - name: Revalidate draft, release order, and public images
        env:
          AUTOMATA_DIGEST: ${{ needs.stage_release.outputs.automata_digest }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          RUNNER_DIGEST: ${{ needs.stage_release.outputs.runner_digest }}
        run: |
          install -d -m 0700 -- "$TMPDIR"
          remote_refs="$(
            env -u CARGO_REGISTRY_TOKEN -u GH_TOKEN -u GITHUB_TOKEN \
              git ls-remote --exit-code origin \
                "refs/tags/${RELEASE_TAG}" \
                "refs/tags/${RELEASE_TAG}^{}"
          )"
          direct=''
          peeled=''
          while IFS=$'\t' read -r object reference; do
            case "$reference" in
              "refs/tags/${RELEASE_TAG}") direct="$object" ;;
              "refs/tags/${RELEASE_TAG}^{}") peeled="$object" ;;
            esac
          done <<< "$remote_refs"
          [[ "$direct" == "$RELEASE_TAG_OBJECT" && \
            "$peeled" == "$RELEASE_COMMIT" ]] || {
            printf 'error: remote annotated release tag changed after packaging\n' >&2
            exit 1
          }

          archive="target/distribution/automata-x86_64-unknown-linux-musl.tar.gz"
          checksum="${archive}.sha256"
          manifest="target/distribution/automata-release-manifest.json"
          verification_directory="$(mktemp -d "${TMPDIR%/}/draft.XXXXXXXX")"
          trap 'env -u GH_TOKEN -u GITHUB_TOKEN rm -rf -- "$verification_directory"' EXIT
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets |
            env -u GH_TOKEN -u GITHUB_TOKEN python3 -c '
          import json
          import sys
          release = json.load(sys.stdin)
          if release.get("isDraft") is not True:
              raise SystemExit("release is not the expected mutable draft")
          expected_prerelease = sys.argv[1] == "true"
          if release.get("isPrerelease") is not expected_prerelease:
              raise SystemExit("draft release prerelease state differs")
          actual = sorted(asset.get("name") for asset in release.get("assets", []))
          expected = sorted(sys.argv[2:])
          if actual != expected:
              raise SystemExit(f"draft assets differ: {actual!r}")
          ' "$RELEASE_PRERELEASE" \
            "${archive##*/}" "${checksum##*/}" "${manifest##*/}"
          gh release download "$RELEASE_TAG" \
            --dir "$verification_directory" \
            --pattern "${archive##*/}" \
            --pattern "${checksum##*/}" \
            --pattern "${manifest##*/}"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            cmp -- "$archive" "$verification_directory/${archive##*/}"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            cmp -- "$checksum" "$verification_directory/${checksum##*/}"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            cmp -- "$manifest" "$verification_directory/${manifest##*/}"

          release_state="$RUNNER_TEMP/github-releases-before-crates.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$release_state"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            python3 scripts/ci/check-release-order.py \
              --requested-tag "$RELEASE_TAG" \
              --version "$RELEASE_VERSION" \
              --prerelease "$RELEASE_PRERELEASE" < "$release_state"

          verify_image() {
            local image="$1"
            local digest="$2"
            local raw_file="$RUNNER_TEMP/public-image.json"
            docker buildx imagetools inspect "${image}:${RELEASE_VERSION}" \
              --raw > "$raw_file"
            actual="sha256:$(sha256sum "$raw_file" | awk '{print $1}')"
            [[ "$actual" == "$digest" ]] || {
              printf 'error: public version image differs for %s\n' "$image" >&2
              return 1
            }
            docker buildx imagetools inspect "${image}@${digest}" >/dev/null
          }
          verify_image ghcr.io/automata-ci/automata "$AUTOMATA_DIGEST"
          verify_image ghcr.io/automata-ci/automata-runner "$RUNNER_DIGEST"

      - name: Verify packages and prepare the credential-free publication plan
        id: prepare
        env:
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_CREATED: ${{ needs.gate.outputs.created }}
          RELEASE_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          RELEASE_SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.source_date_epoch }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          python3 scripts/ci/release-handoff.py verify-manifest \
            --repository-root . \
            --manifest target/distribution/automata-release-manifest.json \
            --tag "$RELEASE_TAG" \
            --tag-object "$RELEASE_TAG_OBJECT" \
            --commit "$RELEASE_COMMIT" \
            --version "$RELEASE_VERSION" \
            --prerelease "$RELEASE_PRERELEASE" \
            --source-date-epoch "$RELEASE_SOURCE_DATE_EPOCH" \
            --created "$RELEASE_CREATED"
          python3 scripts/ci/publish-crates.py \
            --prepare target/release-publish-plan.json \
            --release-manifest target/distribution/automata-release-manifest.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Create the minimal digest-bound publisher tool bundle
        id: publisher-tools
        env:
          TOOLS_FILENAME: automata-release-tools-${{ github.run_id }}-${{ github.run_attempt }}.tar
        run: |
          tools="target/release-publisher-tools/${TOOLS_FILENAME}"
          install -d -m 0700 -- "${tools%/*}"
          for source in \
            scripts/ci/check-release-order.py \
            scripts/ci/publish-crates.py \
            scripts/ci/release-handoff.py; do
            [[ -f "$source" && ! -L "$source" ]] || {
              printf 'error: publisher tool is not a regular source file: %s\n' \
                "$source" >&2
              exit 1
            }
          done
          tar --create \
            --file "$tools" \
            --format=ustar \
            --group=0 \
            --mode=0444 \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            --no-recursion \
            --numeric-owner \
            --owner=0 \
            --sort=name \
            -- \
            scripts/ci/check-release-order.py \
            scripts/ci/publish-crates.py \
            scripts/ci/release-handoff.py
          tools_sha256="$(sha256sum "$tools" | awk '{print $1}')"
          {
            printf 'tools_filename=%s\n' "$TOOLS_FILENAME"
            printf 'tools_sha256=%s\n' "$tools_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload raw immutable publication plan
        id: upload-plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          if-no-files-found: error
          path: target/release-publish-plan.json
          retention-days: 90

      - name: Upload raw immutable publisher tool bundle
        id: upload-tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          if-no-files-found: error
          path: target/release-publisher-tools/${{ steps.publisher-tools.outputs.tools_filename }}
          retention-days: 90

      - name: Verify uploaded publication plan identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload-plan.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload-plan.outputs.artifact-id }}
          PLAN_SHA256: ${{ steps.prepare.outputs.plan_sha256 }}
        run: |
          artifact_digest="${ARTIFACT_DIGEST#sha256:}"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
            printf 'error: upload action returned an invalid plan artifact ID\n' >&2
            exit 1
          }
          [[ "$artifact_digest" == "$PLAN_SHA256" ]] || {
            printf 'error: artifact service digest differs from the publication plan\n' >&2
            exit 1
          }

      - name: Verify uploaded publisher tool identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload-tools.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload-tools.outputs.artifact-id }}
          TOOLS_SHA256: ${{ steps.publisher-tools.outputs.tools_sha256 }}
        run: |
          artifact_digest="${ARTIFACT_DIGEST#sha256:}"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
            printf 'error: upload action returned an invalid tool artifact ID\n' >&2
            exit 1
          }
          [[ "$artifact_digest" == "$TOOLS_SHA256" ]] || {
            printf 'error: artifact service digest differs from the publisher tools\n' >&2
            exit 1
          }

  publish_crates:
    name: Publish crates.io packages
    needs: [gate, stage_release, prepare_crates]
    if: ${{ needs.prepare_crates.outputs.publish_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download same-run raw handoff by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.stage_release.outputs.handoff_artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/release-publish-handoff
          skip-decompress: true

      - name: Download same-run raw publication plan by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare_crates.outputs.plan_artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/release-publish-plan
          skip-decompress: true

      - name: Download same-run raw publisher tools by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare_crates.outputs.tools_artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/release-publish-tools
          skip-decompress: true

      - name: Materialize only the digest-bound prepared payload
        env:
          AUTOMATA_DIGEST: ${{ needs.stage_release.outputs.automata_digest }}
          HANDOFF_ARTIFACT_DIGEST: ${{ needs.stage_release.outputs.handoff_artifact_digest }}
          HANDOFF_FILENAME: ${{ needs.stage_release.outputs.handoff_filename }}
          HANDOFF_SHA256: ${{ needs.stage_release.outputs.handoff_sha256 }}
          MANIFEST_SHA256: ${{ needs.stage_release.outputs.manifest_sha256 }}
          PLAN_ARTIFACT_DIGEST: ${{ needs.prepare_crates.outputs.plan_artifact_digest }}
          PLAN_SHA256: ${{ needs.prepare_crates.outputs.plan_sha256 }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_CREATED: ${{ needs.gate.outputs.created }}
          RELEASE_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          RELEASE_SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.source_date_epoch }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          RUNNER_DIGEST: ${{ needs.stage_release.outputs.runner_digest }}
          TOOLS_ARTIFACT_DIGEST: ${{ needs.prepare_crates.outputs.tools_artifact_digest }}
          TOOLS_FILENAME: ${{ needs.prepare_crates.outputs.tools_filename }}
          TOOLS_SHA256: ${{ needs.prepare_crates.outputs.tools_sha256 }}
        run: |
          handoff="$RUNNER_TEMP/release-publish-handoff/${HANDOFF_FILENAME}"
          plan="$RUNNER_TEMP/release-publish-plan/release-publish-plan.json"
          tools="$RUNNER_TEMP/release-publish-tools/${TOOLS_FILENAME}"
          [[ "$HANDOFF_FILENAME" =~ ^automata-release-[0-9]+-[0-9]+\.tar$ ]] || {
            printf 'error: unsafe handoff filename\n' >&2
            exit 1
          }
          [[ "$TOOLS_FILENAME" =~ ^automata-release-tools-[0-9]+-[0-9]+\.tar$ ]] || {
            printf 'error: unsafe publisher tool filename\n' >&2
            exit 1
          }
          for specification in \
            "$RUNNER_TEMP/release-publish-handoff:$handoff" \
            "$RUNNER_TEMP/release-publish-plan:$plan" \
            "$RUNNER_TEMP/release-publish-tools:$tools"; do
            directory="${specification%%:*}"
            expected="${specification#*:}"
            mapfile -d '' -t entries < <(
              find "$directory" -mindepth 1 -maxdepth 1 -print0
            )
            if (( ${#entries[@]} != 1 )) || \
              ! [[ "${entries[0]}" == "$expected" && \
                -f "$expected" && ! -L "$expected" ]]; then
              printf 'error: prepared artifact contains an unexpected entry set\n' >&2
              exit 1
            fi
          done
          [[ "${HANDOFF_ARTIFACT_DIGEST#sha256:}" == "$HANDOFF_SHA256" && \
            "$(sha256sum "$handoff" | awk '{print $1}')" == "$HANDOFF_SHA256" ]] || {
            printf 'error: prepared handoff digest changed\n' >&2
            exit 1
          }
          [[ "${PLAN_ARTIFACT_DIGEST#sha256:}" == "$PLAN_SHA256" && \
            "$(sha256sum "$plan" | awk '{print $1}')" == "$PLAN_SHA256" ]] || {
            printf 'error: prepared publication plan digest changed\n' >&2
            exit 1
          }
          [[ "${TOOLS_ARTIFACT_DIGEST#sha256:}" == "$TOOLS_SHA256" ]] || {
            printf 'error: publisher tool artifact digest changed\n' >&2
            exit 1
          }

          publish_root="$(mktemp -d "$RUNNER_TEMP/release-publisher.XXXXXXXX")"
          python3 - "$tools" "$publish_root" "$TOOLS_SHA256" <<'PY'
          import hashlib
          import io
          import os
          import pathlib
          import stat
          import sys
          import tarfile

          archive_path = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          expected_digest = sys.argv[3]
          expected = {
              "scripts/ci/check-release-order.py",
              "scripts/ci/publish-crates.py",
              "scripts/ci/release-handoff.py",
          }
          flags = os.O_RDONLY | getattr(os, "O_CLOEXEC", 0)
          flags |= getattr(os, "O_NOFOLLOW", 0)
          descriptor = os.open(archive_path, flags)
          with os.fdopen(descriptor, "rb") as stream:
              metadata = os.fstat(stream.fileno())
              if (
                  not stat.S_ISREG(metadata.st_mode)
                  or metadata.st_nlink != 1
                  or metadata.st_size > 2 * 1024 * 1024
              ):
                  raise SystemExit("publisher tool archive is not a bounded regular file")
              contents = stream.read(2 * 1024 * 1024 + 1)
          if hashlib.sha256(contents).hexdigest() != expected_digest:
              raise SystemExit("publisher tool archive digest changed")
          selected = {}
          with tarfile.open(fileobj=io.BytesIO(contents), mode="r:") as bundle:
              for member in bundle:
                  if (
                      member.name not in expected
                      or member.name in selected
                      or member.type != tarfile.REGTYPE
                      or member.pax_headers
                      or member.sparse is not None
                      or member.linkname
                      or member.size < 1
                      or member.size > 512 * 1024
                  ):
                      raise SystemExit("publisher tool archive has an unsafe member")
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit("publisher tool archive member is unreadable")
                  data = source.read(member.size + 1)
                  if len(data) != member.size:
                      raise SystemExit("publisher tool archive member size changed")
                  selected[member.name] = data
          if set(selected) != expected:
              raise SystemExit("publisher tool archive member set differs")
          for relative_path in sorted(expected):
              output = destination / relative_path
              output.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
              with output.open("xb") as stream:
                  stream.write(selected[relative_path])
              output.chmod(0o400)
          PY

          python3 "$publish_root/scripts/ci/release-handoff.py" verify-handoff \
            --handoff "$handoff" \
            --handoff-sha256 "$HANDOFF_SHA256" \
            --automata-digest "$AUTOMATA_DIGEST" \
            --runner-digest "$RUNNER_DIGEST" \
            --extract-root "$publish_root" \
            --tag "$RELEASE_TAG" \
            --tag-object "$RELEASE_TAG_OBJECT" \
            --commit "$RELEASE_COMMIT" \
            --version "$RELEASE_VERSION" \
            --prerelease "$RELEASE_PRERELEASE" \
            --source-date-epoch "$RELEASE_SOURCE_DATE_EPOCH" \
            --created "$RELEASE_CREATED" \
            --github-output "$RUNNER_TEMP/publish-handoff-outputs"
          grep -Fx "manifest_sha256=${MANIFEST_SHA256}" \
            "$RUNNER_TEMP/publish-handoff-outputs" >/dev/null
          {
            printf 'PUBLICATION_PLAN=%s\n' "$plan"
            printf 'PUBLISH_ROOT=%s\n' "$publish_root"
          } >> "$GITHUB_ENV"

      - name: Revalidate release state after crates.io environment approval
        env:
          AUTOMATA_DIGEST: ${{ needs.stage_release.outputs.automata_digest }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          RUNNER_DIGEST: ${{ needs.stage_release.outputs.runner_digest }}
        run: |
          cd -- "$PUBLISH_ROOT"
          remote_refs="$(
            env -u CARGO_REGISTRY_TOKEN -u GH_TOKEN -u GITHUB_TOKEN \
              git ls-remote --exit-code \
                "https://github.com/${GITHUB_REPOSITORY}.git" \
                "refs/tags/${RELEASE_TAG}" \
                "refs/tags/${RELEASE_TAG}^{}"
          )"
          direct=''
          peeled=''
          while IFS=$'\t' read -r object reference; do
            case "$reference" in
              "refs/tags/${RELEASE_TAG}") direct="$object" ;;
              "refs/tags/${RELEASE_TAG}^{}") peeled="$object" ;;
            esac
          done <<< "$remote_refs"
          [[ "$direct" == "$RELEASE_TAG_OBJECT" && \
            "$peeled" == "$RELEASE_COMMIT" ]] || {
            printf 'error: release tag changed while awaiting approval\n' >&2
            exit 1
          }

          archive="target/distribution/automata-x86_64-unknown-linux-musl.tar.gz"
          checksum="${archive}.sha256"
          manifest="target/distribution/automata-release-manifest.json"
          verification_directory="$(
            mktemp -d "$RUNNER_TEMP/crates-approved.XXXXXXXX"
          )"
          trap 'env -u GH_TOKEN -u GITHUB_TOKEN rm -rf -- "$verification_directory"' EXIT
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets |
            env -u GH_TOKEN -u GITHUB_TOKEN python3 -c '
          import json
          import sys
          release = json.load(sys.stdin)
          if release.get("isDraft") is not True:
              raise SystemExit("release is not the expected mutable draft")
          expected_prerelease = sys.argv[1] == "true"
          if release.get("isPrerelease") is not expected_prerelease:
              raise SystemExit("draft release prerelease state differs")
          actual = sorted(asset.get("name") for asset in release.get("assets", []))
          expected = sorted(sys.argv[2:])
          if actual != expected:
              raise SystemExit(f"draft assets differ: {actual!r}")
          ' "$RELEASE_PRERELEASE" \
            "${archive##*/}" "${checksum##*/}" "${manifest##*/}"
          gh release download "$RELEASE_TAG" \
            --dir "$verification_directory" \
            --pattern "${archive##*/}" \
            --pattern "${checksum##*/}" \
            --pattern "${manifest##*/}"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            cmp -- "$archive" "$verification_directory/${archive##*/}"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            cmp -- "$checksum" "$verification_directory/${checksum##*/}"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            cmp -- "$manifest" "$verification_directory/${manifest##*/}"

          release_state="$RUNNER_TEMP/github-releases-after-approval.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$release_state"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            python3 scripts/ci/check-release-order.py \
              --requested-tag "$RELEASE_TAG" \
              --version "$RELEASE_VERSION" \
              --prerelease "$RELEASE_PRERELEASE" < "$release_state"

          verify_image() {
            local image="$1"
            local digest="$2"
            local raw_file="$RUNNER_TEMP/approved-image.json"
            docker buildx imagetools inspect "${image}:${RELEASE_VERSION}" \
              --raw > "$raw_file"
            actual="sha256:$(sha256sum "$raw_file" | awk '{print $1}')"
            [[ "$actual" == "$digest" ]] || {
              printf 'error: approved version image differs for %s\n' "$image" >&2
              return 1
            }
            docker buildx imagetools inspect "${image}@${digest}" >/dev/null
          }
          verify_image ghcr.io/automata-ci/automata "$AUTOMATA_DIGEST"
          verify_image ghcr.io/automata-ci/automata-runner "$RUNNER_DIGEST"

      # id-token permission is job-wide. Before this explicit crates.io exchange,
      # this job runs only pinned artifact downloads, bounded materialization,
      # fixed runner clients, and the three digest-bound audited release helpers.
      # It checks out no repository and runs no build or dependency code.
      - name: Request short-lived crates.io credentials
        id: crates-auth
        if: ${{ vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # The bounded executor sends the exact handoff .crate bytes through the
      # documented length-prefixed registry API. It neither builds nor invokes
      # Cargo, follows no redirects, and reconciles every visible checksum.
      - name: Publish exact prepared crates.io archives
        env:
          CRATES_IO_EXPECTED_OWNER_LOGINS: ${{ needs.gate.outputs.crates_io_owner_logins }}
          CRATES_IO_INITIAL_BURST_OVERRIDE_APPROVED: ${{ needs.gate.outputs.crates_io_initial_burst_override_approved }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
          PLAN_SHA256: ${{ needs.prepare_crates.outputs.plan_sha256 }}
        run: |
          [[ -n "$CARGO_REGISTRY_TOKEN" ]] || {
            printf '%s\n' \
              'error: configure crates.io Trusted Publishing or the one-time' \
              'crates-io-environment CARGO_REGISTRY_TOKEN bootstrap secret' >&2
            exit 1
          }
          cd -- "$PUBLISH_ROOT"
          python3 scripts/ci/publish-crates.py \
            --execute-prepared "$PUBLICATION_PLAN" \
            --release-manifest target/distribution/automata-release-manifest.json \
            --plan-sha256 "$PLAN_SHA256"

  finalize_release:
    name: Finalize public release
    needs: [gate, stage_release, prepare_crates, publish_crates]
    if: >-
      ${{
        always() &&
        needs.gate.result == 'success' &&
        needs.stage_release.result == 'success' &&
        needs.prepare_crates.result == 'success' &&
        (
          needs.publish_crates.result == 'success' ||
          (
            needs.publish_crates.result == 'skipped' &&
            needs.prepare_crates.outputs.publish_required == 'false'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/target/task-tmp/release-finalize/docker-config
      TMPDIR: ${{ github.workspace }}/target/task-tmp/release-finalize
    steps:
      - name: Check out the gated release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.gate.outputs.tag }}

      - name: Download same-run raw handoff by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.stage_release.outputs.handoff_artifact_id }}
          digest-mismatch: error
          path: target/release-handoff-download
          skip-decompress: true

      - name: Verify and extract immutable handoff
        env:
          ARTIFACT_DIGEST: ${{ needs.stage_release.outputs.handoff_artifact_digest }}
          EXPECTED_FILENAME: ${{ needs.stage_release.outputs.handoff_filename }}
          HANDOFF_SHA256: ${{ needs.stage_release.outputs.handoff_sha256 }}
          MANIFEST_SHA256: ${{ needs.stage_release.outputs.manifest_sha256 }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_CREATED: ${{ needs.gate.outputs.created }}
          RELEASE_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          RELEASE_SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.source_date_epoch }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          install -d -m 0700 -- "$TMPDIR" "$DOCKER_CONFIG"
          artifact_digest="${ARTIFACT_DIGEST#sha256:}"
          [[ "$artifact_digest" == "$HANDOFF_SHA256" ]] || {
            printf 'error: artifact-service and handoff digests differ\n' >&2
            exit 1
          }
          [[ "$EXPECTED_FILENAME" =~ ^automata-release-[0-9]+-[0-9]+\.tar$ ]] || {
            printf 'error: unsafe handoff filename\n' >&2
            exit 1
          }
          handoff="target/release-handoff-download/${EXPECTED_FILENAME}"
          mapfile -d '' -t downloaded < <(
            find target/release-handoff-download -mindepth 1 -maxdepth 1 \
              -print0
          )
          if (( ${#downloaded[@]} != 1 )) || \
            ! [[ "${downloaded[0]}" == "$handoff" && \
              -f "$handoff" && ! -L "$handoff" ]]; then
            printf 'error: handoff download contains an unexpected entry set\n' >&2
            exit 1
          fi
          python3 scripts/ci/release-handoff.py verify-handoff \
            --handoff "$handoff" \
            --handoff-sha256 "$HANDOFF_SHA256" \
            --automata-digest "${{ needs.stage_release.outputs.automata_digest }}" \
            --runner-digest "${{ needs.stage_release.outputs.runner_digest }}" \
            --extract-root . \
            --tag "$RELEASE_TAG" \
            --tag-object "$RELEASE_TAG_OBJECT" \
            --commit "$RELEASE_COMMIT" \
            --version "$RELEASE_VERSION" \
            --prerelease "$RELEASE_PRERELEASE" \
            --source-date-epoch "$RELEASE_SOURCE_DATE_EPOCH" \
            --created "$RELEASE_CREATED" \
            --github-output "$RUNNER_TEMP/verified-handoff-outputs"
          grep -Fx "manifest_sha256=${MANIFEST_SHA256}" \
            "$RUNNER_TEMP/verified-handoff-outputs" >/dev/null

      - name: Revalidate remote tag, draft bytes, and public images
        env:
          AUTOMATA_DIGEST: ${{ needs.stage_release.outputs.automata_digest }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          RUNNER_DIGEST: ${{ needs.stage_release.outputs.runner_digest }}
        run: |
          local_object="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}")"
          local_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$local_object" == "$RELEASE_TAG_OBJECT" && \
            "$local_commit" == "$RELEASE_COMMIT" ]] || {
            printf 'error: local release identity differs from the gate\n' >&2
            exit 1
          }
          remote_refs="$(
            env -u CARGO_REGISTRY_TOKEN -u GH_TOKEN -u GITHUB_TOKEN \
              git ls-remote --exit-code origin \
                "refs/tags/${RELEASE_TAG}" \
                "refs/tags/${RELEASE_TAG}^{}"
          )"
          direct=''
          peeled=''
          while IFS=$'\t' read -r object reference; do
            case "$reference" in
              "refs/tags/${RELEASE_TAG}") direct="$object" ;;
              "refs/tags/${RELEASE_TAG}^{}") peeled="$object" ;;
            esac
          done <<< "$remote_refs"
          [[ "$direct" == "$RELEASE_TAG_OBJECT" && \
            "$peeled" == "$RELEASE_COMMIT" ]] || {
            printf 'error: remote annotated release tag changed identity\n' >&2
            exit 1
          }

          archive="target/distribution/automata-x86_64-unknown-linux-musl.tar.gz"
          checksum="${archive}.sha256"
          manifest="target/distribution/automata-release-manifest.json"
          verification_directory="$(mktemp -d "${TMPDIR%/}/finalize.XXXXXXXX")"
          trap 'env -u GH_TOKEN -u GITHUB_TOKEN rm -rf -- "$verification_directory"' EXIT
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets |
            env -u GH_TOKEN -u GITHUB_TOKEN python3 -c '
          import json
          import sys
          release = json.load(sys.stdin)
          if release.get("isDraft") is not True:
              raise SystemExit("release is not the expected draft")
          expected_prerelease = sys.argv[1] == "true"
          if release.get("isPrerelease") is not expected_prerelease:
              raise SystemExit("draft release prerelease state differs")
          actual = sorted(asset.get("name") for asset in release.get("assets", []))
          expected = sorted(sys.argv[2:])
          if actual != expected:
              raise SystemExit(f"draft assets differ: {actual!r}")
          ' "$RELEASE_PRERELEASE" \
            "${archive##*/}" "${checksum##*/}" "${manifest##*/}"
          gh release download "$RELEASE_TAG" \
            --dir "$verification_directory" \
            --pattern "${archive##*/}" \
            --pattern "${checksum##*/}" \
            --pattern "${manifest##*/}"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            cmp -- "$archive" "$verification_directory/${archive##*/}"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            cmp -- "$checksum" "$verification_directory/${checksum##*/}"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            cmp -- "$manifest" "$verification_directory/${manifest##*/}"

          verify_image() {
            local image="$1"
            local digest="$2"
            local raw_file="$RUNNER_TEMP/final-image.json"
            docker buildx imagetools inspect "${image}:${RELEASE_VERSION}" \
              --raw > "$raw_file"
            actual="sha256:$(sha256sum "$raw_file" | awk '{print $1}')"
            [[ "$actual" == "$digest" ]] || {
              printf 'error: version image differs for %s\n' "$image" >&2
              return 1
            }
            docker buildx imagetools inspect "${image}@${digest}" >/dev/null
          }
          verify_image ghcr.io/automata-ci/automata "$AUTOMATA_DIGEST"
          verify_image ghcr.io/automata-ci/automata-runner "$RUNNER_DIGEST"

      - name: Revalidate release order before finalization
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          release_state="$RUNNER_TEMP/github-releases-before-alias.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$release_state"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            python3 scripts/ci/check-release-order.py \
              --requested-tag "$RELEASE_TAG" \
              --version "$RELEASE_VERSION" \
              --prerelease "$RELEASE_PRERELEASE" < "$release_state"

      - name: Reconcile exact crates.io versions before alias promotion
        env:
          CRATES_IO_EXPECTED_OWNER_LOGINS: ${{ needs.gate.outputs.crates_io_owner_logins }}
        run: |
          python3 scripts/ci/publish-crates.py \
            --verify-published \
            --release-manifest target/distribution/automata-release-manifest.json

      - name: Sign in to GHCR for stable alias promotion
        if: ${{ needs.gate.outputs.prerelease == 'false' }}
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Promote verified image digests to latest
        if: ${{ needs.gate.outputs.prerelease == 'false' }}
        env:
          AUTOMATA_DIGEST: ${{ needs.stage_release.outputs.automata_digest }}
          RUNNER_DIGEST: ${{ needs.stage_release.outputs.runner_digest }}
        run: |
          promote_image() {
            local image="$1"
            local digest="$2"
            docker buildx imagetools create \
              --tag "${image}:latest" \
              "${image}@${digest}"
          }

          promote_image \
            ghcr.io/automata-ci/automata \
            "$AUTOMATA_DIGEST"
          promote_image \
            ghcr.io/automata-ci/automata-runner \
            "$RUNNER_DIGEST"

      - name: Verify anonymous stable aliases
        if: ${{ needs.gate.outputs.prerelease == 'false' }}
        env:
          AUTOMATA_DIGEST: ${{ needs.stage_release.outputs.automata_digest }}
          RUNNER_DIGEST: ${{ needs.stage_release.outputs.runner_digest }}
        run: |
          docker logout ghcr.io

          verify_alias() {
            local image="$1"
            local expected_digest="$2"
            local actual_digest
            actual_digest="sha256:$(
              docker buildx imagetools inspect "${image}:latest" --raw |
                sha256sum |
                awk '{print $1}'
            )" || {
              printf 'error: latest is not anonymously readable for %s\n' \
                "$image" >&2
              return 1
            }
            [[ "$actual_digest" == "$expected_digest" ]] || {
              printf 'error: %s:latest resolved to %s, expected %s\n' \
                "$image" "$actual_digest" "$expected_digest" >&2
              return 1
            }
          }

          verify_alias \
            ghcr.io/automata-ci/automata \
            "$AUTOMATA_DIGEST"
          verify_alias \
            ghcr.io/automata-ci/automata-runner \
            "$RUNNER_DIGEST"

      - name: Sign out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io || true

      - name: Publish GitHub Release
        env:
          AUTOMATA_DIGEST: ${{ needs.stage_release.outputs.automata_digest }}
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          RUNNER_DIGEST: ${{ needs.stage_release.outputs.runner_digest }}
        run: |
          archive="target/distribution/automata-x86_64-unknown-linux-musl.tar.gz"
          checksum="${archive}.sha256"
          manifest="target/distribution/automata-release-manifest.json"
          archive_name="${archive##*/}"
          checksum_name="${checksum##*/}"
          manifest_name="${manifest##*/}"

          require_remote_release_commit() {
            local direct_object=''
            local object
            local peeled_object=''
            local reference
            local remote_refs

            if ! remote_refs="$(
              env -u CARGO_REGISTRY_TOKEN -u GH_TOKEN -u GITHUB_TOKEN \
                git ls-remote --exit-code origin \
                  "refs/tags/${RELEASE_TAG}" \
                  "refs/tags/${RELEASE_TAG}^{}"
            )"; then
              printf 'error: unable to resolve remote release tag %s\n' \
                "$RELEASE_TAG" >&2
              return 1
            fi
            while IFS=$'\t' read -r object reference; do
              case "$reference" in
                "refs/tags/${RELEASE_TAG}") direct_object="$object" ;;
                "refs/tags/${RELEASE_TAG}^{}") peeled_object="$object" ;;
              esac
            done <<< "$remote_refs"
            [[ "$direct_object" == "$RELEASE_TAG_OBJECT" && \
              "$peeled_object" == "$RELEASE_COMMIT" ]] || {
              printf 'error: remote annotated tag %s changed identity\n' \
                "$RELEASE_TAG" >&2
              return 1
            }
          }

          require_exact_draft_assets() {
            gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets |
              env -u GH_TOKEN -u GITHUB_TOKEN python3 -c '
          import json
          import sys

          release = json.load(sys.stdin)
          if release.get("isDraft") is not True:
              raise SystemExit("release is already published and immutable")
          expected_prerelease = sys.argv[1] == "true"
          if release.get("isPrerelease") is not expected_prerelease:
              raise SystemExit("draft release prerelease state differs")
          actual = sorted(asset.get("name") for asset in release.get("assets", []))
          expected = sorted(sys.argv[2:])
          if actual != expected:
              raise SystemExit(
                  f"draft release assets differ from the exact expected set: {actual!r}"
              )
          ' "$IS_PRERELEASE" "$archive_name" "$checksum_name" "$manifest_name"
          }

          require_exact_published_release() {
            gh release view "$RELEASE_TAG" \
              --json isDraft,isPrerelease,tagName,assets |
              env -u GH_TOKEN -u GITHUB_TOKEN python3 -c '
          import json
          import sys

          release = json.load(sys.stdin)
          expected_prerelease = sys.argv[1] == "true"
          if release.get("isDraft") is not False:
              raise SystemExit("release did not become public")
          if release.get("isPrerelease") is not expected_prerelease:
              raise SystemExit("published release prerelease state differs")
          if release.get("tagName") != sys.argv[2]:
              raise SystemExit("published release tag differs")
          actual = sorted(asset.get("name") for asset in release.get("assets", []))
          expected = sorted(sys.argv[3:])
          if actual != expected:
              raise SystemExit(
                  f"published release assets differ from the exact set: {actual!r}"
              )
          ' "$IS_PRERELEASE" "$RELEASE_TAG" \
            "$archive_name" "$checksum_name" "$manifest_name"
            if [[ "$IS_PRERELEASE" == false ]]; then
              latest_tag="$(
                gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
                  --jq .tag_name
              )" || return 1
              [[ "$latest_tag" == "$RELEASE_TAG" ]] || {
                printf 'error: stable release did not become latest\n' >&2
                return 1
              }
            fi
          }

          require_release_order() {
            local release_state="$RUNNER_TEMP/github-releases-before-publication.json"
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$release_state"
            env -u GH_TOKEN -u GITHUB_TOKEN \
              python3 scripts/ci/check-release-order.py \
                --requested-tag "$RELEASE_TAG" \
                --version "$RELEASE_VERSION" \
                --prerelease "$IS_PRERELEASE" < "$release_state"
          }

          require_exact_version_image() {
            local actual_digest
            local expected_digest="$2"
            local image="$1"
            local raw_file="$RUNNER_TEMP/pre-public-image.json"
            docker buildx imagetools inspect \
              "${image}:${RELEASE_VERSION}" --raw > "$raw_file"
            actual_digest="sha256:$(sha256sum "$raw_file" | awk '{print $1}')"
            [[ "$actual_digest" == "$expected_digest" ]] || {
              printf 'error: version image changed before publication for %s\n' \
                "$image" >&2
              return 1
            }
            docker buildx imagetools inspect \
              "${image}@${expected_digest}" >/dev/null
          }

          verify_remote_release_assets() (
            verification_directory="$(
              env -u GH_TOKEN -u GITHUB_TOKEN \
                mktemp -d "${TMPDIR%/}/release-assets.XXXXXXXX"
            )"
            trap 'env -u GH_TOKEN -u GITHUB_TOKEN rm -rf -- "$verification_directory"' EXIT
            gh release download "$RELEASE_TAG" \
              --dir "$verification_directory" \
              --pattern "$archive_name" \
              --pattern "$checksum_name" \
              --pattern "$manifest_name"
            env -u GH_TOKEN -u GITHUB_TOKEN \
              cmp -- "$archive" "$verification_directory/$archive_name"
            env -u GH_TOKEN -u GITHUB_TOKEN \
              cmp -- "$checksum" "$verification_directory/$checksum_name"
            env -u GH_TOKEN -u GITHUB_TOKEN \
              cmp -- "$manifest" "$verification_directory/$manifest_name"
            (
              cd -- "$verification_directory"
              env -u GH_TOKEN -u GITHUB_TOKEN \
                sha256sum --check --strict "$checksum_name"
            )
          )

          require_exact_draft_assets
          verify_remote_release_assets
          require_release_order
          require_exact_version_image \
            ghcr.io/automata-ci/automata "$AUTOMATA_DIGEST"
          require_exact_version_image \
            ghcr.io/automata-ci/automata-runner "$RUNNER_DIGEST"
          require_exact_draft_assets
          require_remote_release_commit
          edit_status=0
          if [[ "$IS_PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" \
              --draft=false --prerelease --latest=false || edit_status=$?
          else
            gh release edit "$RELEASE_TAG" \
              --draft=false --prerelease=false --latest || edit_status=$?
          fi

          # Keep these as standalone commands. Calling a Bash function from a
          # negated/OR-list condition disables errexit inside that function and
          # can let a later successful command mask an earlier failed check.
          require_exact_published_release
          verify_remote_release_assets
          require_remote_release_commit
          if (( edit_status != 0 )); then
            printf '%s\n' \
              'GitHub Release edit returned an error, but the exact public state was reconciled.'
          fi
