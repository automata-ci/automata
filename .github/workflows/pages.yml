name: UI demo and screenshots

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "ui/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "ui/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build demo and capture screenshots
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare task scratch directory
        env:
          TMPDIR: ${{ github.workspace }}/target/task-tmp/pages
        run: install -d -m 0700 -- "$TMPDIR"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install locked demo dependencies
        working-directory: ui
        env:
          TMPDIR: ${{ github.workspace }}/target/task-tmp/pages
        run: npm ci

      - name: Install Chromium
        working-directory: ui
        env:
          TMPDIR: ${{ github.workspace }}/target/task-tmp/pages
        run: npx --no-install playwright install --with-deps chromium

      - name: Build demo and capture theme-aware screenshots
        working-directory: ui
        env:
          TMPDIR: ${{ github.workspace }}/target/task-tmp/pages
        run: npm run screenshots

      - name: Upload screenshot review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screenshots
          path: ui/dist/preview/screenshots
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ui/dist/preview

  deploy:
    name: Deploy UI demo
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
