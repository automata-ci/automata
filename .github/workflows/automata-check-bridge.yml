name: Native CI bridge

on:
  push:
    branches:
      - main

permissions:
  checks: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automata:
    name: Require Automata CI
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AUTOMATA_CHECK_APP_ID: ${{ vars.AUTOMATA_CHECK_APP_ID }}
      AUTOMATA_CHECK_NAME: Automata CI
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Wait for the exact Automata Check Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          env -u GH_TOKEN -u GITHUB_TOKEN python3 - <<'PY'
          import os
          import re

          sha = os.environ["EXPECTED_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit("native CI bridge received a non-canonical commit SHA")

          raw_app_id = os.environ.get("AUTOMATA_CHECK_APP_ID", "")
          if re.fullmatch(r"[1-9][0-9]*", raw_app_id) is None:
              raise SystemExit(
                  "AUTOMATA_CHECK_APP_ID must be the positive numeric ID of the configured Automata GitHub App"
              )
          app_id = int(raw_app_id)
          if app_id > 2**63 - 1:
              raise SystemExit("AUTOMATA_CHECK_APP_ID exceeds GitHub's identifier range")

          if os.environ.get("AUTOMATA_CHECK_NAME") != "Automata CI":
              raise SystemExit("native CI bridge Check name does not match the repository contract")
          PY

          endpoint="repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs"
          response="$RUNNER_TEMP/automata-check-runs.json"
          # Portable CI permits 60 minutes for coverage plus a five-minute
          # terminal fan-in. Keep ten minutes of API/polling headroom.
          deadline="$(( $(date +%s) + 4500 ))"
          api_failures=0

          while (( $(date +%s) < deadline )); do
            if ! gh api --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$endpoint" \
              -f app_id="$AUTOMATA_CHECK_APP_ID" \
              -f check_name="$AUTOMATA_CHECK_NAME" \
              -f filter=latest \
              -f per_page=100 > "$response"; then
              api_failures="$((api_failures + 1))"
              if (( api_failures >= 3 )); then
                printf 'error: unable to query Check Runs for %s after %s consecutive failures\n' \
                  "$EXPECTED_SHA" "$api_failures" >&2
                exit 1
              fi
              printf 'warning: Check Run query failed; retrying (%s/3)\n' \
                "$api_failures" >&2
              sleep 30
              continue
            fi
            api_failures=0

            set +e
            env -u GH_TOKEN -u GITHUB_TOKEN python3 - "$response" <<'PY'
          import json
          import os
          import re
          import sys

          WAITING = 10
          INVALID = 20

          try:
              with open(sys.argv[1], encoding="utf-8") as response:
                  payload = json.load(response)
          except (OSError, UnicodeError, json.JSONDecodeError) as error:
              print(f"error: GitHub returned an unreadable Check Run response: {error}", file=sys.stderr)
              raise SystemExit(INVALID)

          runs = payload.get("check_runs") if isinstance(payload, dict) else None
          total_count = payload.get("total_count") if isinstance(payload, dict) else None
          if (
              not isinstance(runs, list)
              or isinstance(total_count, bool)
              or not isinstance(total_count, int)
              or total_count != len(runs)
          ):
              print("error: GitHub returned a malformed or truncated Check Run page", file=sys.stderr)
              raise SystemExit(INVALID)

          expected_sha = os.environ["EXPECTED_SHA"]
          expected_name = os.environ["AUTOMATA_CHECK_NAME"]
          expected_app_id = int(os.environ["AUTOMATA_CHECK_APP_ID"])
          exact = []
          for run in runs:
              if not isinstance(run, dict):
                  print("error: GitHub returned a malformed Check Run", file=sys.stderr)
                  raise SystemExit(INVALID)
              app = run.get("app")
              if (
                  run.get("head_sha") == expected_sha
                  and run.get("name") == expected_name
                  and isinstance(app, dict)
                  and app.get("id") == expected_app_id
              ):
                  exact.append(run)

          if not exact:
              print(f"Waiting for {expected_name!r} from App {expected_app_id} on {expected_sha}...")
              raise SystemExit(WAITING)
          if len(exact) != 1:
              print("error: the exact Automata Check Run identity is ambiguous", file=sys.stderr)
              raise SystemExit(INVALID)

          run = exact[0]
          external_id = run.get("external_id")
          if not isinstance(external_id, str) or re.fullmatch(
              r"automata-check:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",
              external_id,
          ) is None:
              print("error: the exact Check Run lacks an Automata subject identity", file=sys.stderr)
              raise SystemExit(INVALID)

          status = run.get("status")
          conclusion = run.get("conclusion")
          url = run.get("html_url")
          if not isinstance(url, str) or not url.startswith("https://github.com/"):
              print("error: the exact Check Run lacks a canonical GitHub URL", file=sys.stderr)
              raise SystemExit(INVALID)
          if status in {"queued", "in_progress"} and conclusion is None:
              print(f"Waiting for exact Automata Check Run: {url}")
              raise SystemExit(WAITING)
          if status == "completed" and conclusion == "success":
              print(f"Accepted exact Automata Check Run: {url}")
              raise SystemExit(0)
          if status == "completed" and isinstance(conclusion, str):
              print(
                  f"error: exact Automata Check Run concluded {conclusion}: {url}",
                  file=sys.stderr,
              )
              raise SystemExit(INVALID)

          print("error: the exact Automata Check Run has an invalid state", file=sys.stderr)
          raise SystemExit(INVALID)
          PY
            check_state="$?"
            set -e

            case "$check_state" in
              0) exit 0 ;;
              10) sleep 30 ;;
              *) exit 1 ;;
            esac
          done

          printf 'error: timed out waiting for exact Automata Check Run on %s\n' \
            "$EXPECTED_SHA" >&2
          exit 1
