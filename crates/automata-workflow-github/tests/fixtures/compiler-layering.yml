name: Layering
on: push
env:
  SHARED: workflow
  WORKFLOW_ONLY: workflow
defaults:
  run:
    working-directory: workflow-dir
jobs:
  build:
    runs-on:
      - self-hosted
      - linux
    env:
      SHARED: job
      JOB_ONLY: job
    defaults:
      run:
        working-directory: job-dir
    steps:
      - name: Layered run
        env:
          SHARED: step
          STEP_ONLY: step
        working-directory: step-dir
        run: echo "${{ env.SHARED }}"
