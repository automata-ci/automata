[package]
name = "automata-ci-runner"
description = "Automata workflow runner for Linux, Windows, and isolated macOS hosts"
publish.workspace = true
readme = "README.md"
keywords = ["ci", "github-actions", "self-hosted", "runner", "automation"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
build = "build.rs"

[[bin]]
name = "automata-runner"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
automata-ci-action.workspace = true
automata-ci-action-cache-file.workspace = true
