automata-ci-blob.workspace = true
automata-ci-blob-s3.workspace = true
automata-ci-auth.workspace = true
automata-ci-core.workspace = true
automata-ci-execution.workspace = true
automata-ci-expression-github.workspace = true
automata-ci-github.workspace = true
automata-ci-github-runtime.workspace = true
automata-ci-job-executor-github.workspace = true
automata-ci-metrics.workspace = true
automata-ci-protocol.workspace = true
automata-ci-runner-crypto.workspace = true
automata-ci-runner-journal.workspace = true
automata-ci-runner-runtime.workspace = true
automata-ci-runner-spool.workspace = true
automata-ci-runner-transport.workspace = true
automata-ci-sandbox-kubernetes.workspace = true
automata-ci-sandbox-podman.workspace = true
automata-ci-sandbox-macos.workspace = true
automata-ci-sandbox-windows.workspace = true
automata-ci-scm.workspace = true
automata-ci-workflow-github.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
http.workspace = true
kube.workspace = true
reqwest.workspace = true
prometheus-client.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
