[package]
name = "automata-ci-postgres"
description = "PostgreSQL adapters for Automata's durable control-plane ports"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
autotests = false

[features]
default = []
test-support = []

[[test]]
name = "postgres"
path = "tests/postgres.rs"

[[example]]
name = "postgres-test-cleanup"
path = "examples/postgres-test-cleanup.rs"
required-features = ["test-support"]

[dependencies]
async-trait.workspace = true
automata-ci-auth.workspace = true
automata-ci-blob.workspace = true
automata-ci-control.workspace = true
automata-ci-core.workspace = true
automata-ci-key-management.workspace = true
automata-ci-oidc-github.workspace = true
automata-ci-provisioning.workspace = true
automata-ci-schedule.workspace = true
automata-ci-secret.workspace = true
automata-ci-store = { workspace = true, features = ["adapter-spi"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
automata-ci-protocol.workspace = true
static_assertions.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
