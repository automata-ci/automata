name: Upload a Build Artifact
description: Upload a build artifact that can be used by subsequent workflow steps
inputs:
  name:
    description: Artifact name
    default: artifact
  path:
    description: Files or directories to upload
    required: true
  if-no-files-found:
    description: Behavior if no files are found
    default: warn
  compression-level:
    description: Zlib compression level
    default: '6'
  retention-days:
    description: Artifact retention in days
outputs:
  artifact-id:
    description: GitHub ID of the artifact
  artifact-url:
    description: Download URL for the artifact
  artifact-digest:
    description: SHA-256 digest of the artifact
runs:
  using: node24
  main: dist/index.js
