groups:
  - name: automata-ci-rates
    interval: 30s
    rules:
      - record: job:automata_ci_control_plane_http_requests:rate5m
        expr: >-
          sum without (instance, route, method, status_class) (
            rate(automata_ci_control_plane_http_requests_total[5m])
          )

      - record: job:automata_ci_control_plane_http_errors:rate5m
        expr: >-
          sum without (instance, route, method, status_class) (
            rate(automata_ci_control_plane_http_requests_total{status_class="5xx"}[5m])
          )

      - record: job:automata_ci_control_plane_http_error_ratio:rate5m
        expr: >-
          job:automata_ci_control_plane_http_errors:rate5m
          /
          clamp_min(job:automata_ci_control_plane_http_requests:rate5m, 1e-9)

      - record: job_route:automata_ci_control_plane_http_request_duration_seconds:p95_5m
        expr: >-
          histogram_quantile(
            0.95,
            sum without (instance, method) (
              rate(automata_ci_control_plane_http_request_duration_seconds_bucket[5m])
            )
          )

      - record: job_route:automata_ci_control_plane_http_request_duration_seconds:p99_5m
        expr: >-
          histogram_quantile(
            0.99,
            sum without (instance, method) (
              rate(automata_ci_control_plane_http_request_duration_seconds_bucket[5m])
            )
          )

      - record: job:automata_ci_runner_control_requests:rate5m
        expr: >-
          sum without (instance, kind, outcome) (
            rate(automata_ci_runner_control_requests_total{job="automata-runner"}[5m])
          )

      - record: job:automata_ci_runner_control_failures:rate5m
        expr: >-
          sum without (instance, kind, outcome) (
            rate(automata_ci_runner_control_requests_total{
              job="automata-runner",
              outcome=~"transport_error|timeout|http_error|invalid_response"
            }[5m])
          )

      - record: job:automata_ci_runner_control_failure_ratio:rate5m
        expr: >-
          job:automata_ci_runner_control_failures:rate5m
          /
          clamp_min(
            sum without (instance, kind, outcome) (
              rate(automata_ci_runner_control_requests_total{
                job="automata-runner",
                outcome!="cancelled"
              }[5m])
            ),
            1e-9
          )

  - name: automata-ci-fleet-state
    interval: 30s
    rules:
      - record: cluster:automata_ci_control_plane_ready:max
        expr: max without (instance) (automata_ci_control_plane_ready)

      - record: cluster_dependency:automata_ci_control_plane_dependency_ready:max
        expr: >-
          max without (instance) (
            automata_ci_control_plane_dependency_ready
          )

      - record: cluster_status:automata_ci_control_plane_workflow_runs:max
        expr: >-
          max without (instance) (
            automata_ci_control_plane_workflow_runs
          )

      - record: cluster_lifecycle:automata_ci_control_plane_job_attempts:max
        expr: >-
          max without (instance) (
            automata_ci_control_plane_job_attempts
          )

      - record: cluster_state:automata_ci_control_plane_queue_jobs:max
        expr: >-
          max without (instance) (
            automata_ci_control_plane_queue_jobs
          )

      - record: cluster_state:automata_ci_control_plane_queue_age_seconds:max
        expr: >-
          clamp_min(
            time()
            - max without (instance) (
                automata_ci_control_plane_queue_oldest_timestamp_seconds
              ),
            0
          )
          and
          max without (instance) (
            automata_ci_control_plane_queue_oldest_timestamp_seconds
          ) > 0
          and
          cluster_state:automata_ci_control_plane_queue_jobs:max > 0

      - record: cluster_reason:automata_ci_control_plane_eligible_queue_blocked_jobs:max
        expr: >-
          max without (instance) (
            automata_ci_control_plane_eligible_queue_blocked_jobs
          )

      - record: cluster_reason:automata_ci_control_plane_eligible_queue_blocked_age_seconds:max
        expr: >-
          clamp_min(
            time()
            - max without (instance) (
                automata_ci_control_plane_eligible_queue_blocked_oldest_timestamp_seconds
              ),
            0
          )
          and
          max without (instance) (
            automata_ci_control_plane_eligible_queue_blocked_oldest_timestamp_seconds
          ) > 0
          and
          cluster_reason:automata_ci_control_plane_eligible_queue_blocked_jobs:max > 0

      - record: cluster_state:automata_ci_control_plane_workflow_plan_v2_runs:max
        expr: >-
          max without (instance) (
            automata_ci_control_plane_workflow_plan_v2_runs
          )

      - record: cluster_state:automata_ci_control_plane_logical_jobs:max
        expr: >-
          max without (instance) (
            automata_ci_control_plane_logical_jobs
          )

      - record: cluster_state:automata_ci_control_plane_logical_activations:max
        expr: >-
          max without (instance) (
            automata_ci_control_plane_logical_activations
          )

      - record: cluster_state:automata_ci_control_plane_logical_activation_age_seconds:max
        expr: >-
          clamp_min(
            time()
            - max without (instance) (
                automata_ci_control_plane_logical_activation_oldest_timestamp_seconds
              ),
            0
          )
          and
          max without (instance) (
            automata_ci_control_plane_logical_activation_oldest_timestamp_seconds
          ) > 0
          and
          cluster_state:automata_ci_control_plane_logical_activations:max > 0

      - record: cluster:automata_ci_control_plane_logical_activation_publications:max
        expr: >-
          max without (instance) (
            automata_ci_control_plane_logical_activation_publications
          )

      - record: cluster:automata_ci_control_plane_logical_materialized_instances:max
        expr: >-
          max without (instance) (
            automata_ci_control_plane_logical_materialized_instances
          )

      - record: cluster:automata_ci_control_plane_commands_pending:max
        expr: >-
          max without (instance) (
            automata_ci_control_plane_commands_pending
          )

      - record: cluster:automata_ci_control_plane_commands_oldest_age_seconds:max
        expr: >-
          clamp_min(
            time()
            - max without (instance) (
                automata_ci_control_plane_commands_oldest_timestamp_seconds
              ),
            0
          )
          and
          max without (instance) (
            automata_ci_control_plane_commands_oldest_timestamp_seconds
          ) > 0
          and
          cluster:automata_ci_control_plane_commands_pending:max > 0

      - record: cluster:automata_ci_control_plane_cancellation_intents_pending:max
        expr: >-
          max without (instance) (
            automata_ci_control_plane_cancellation_intents_pending
          )

      - record: cluster:automata_ci_control_plane_cancellation_intents_oldest_age_seconds:max
        expr: >-
          clamp_min(
            time()
            - max without (instance) (
                automata_ci_control_plane_cancellation_intents_oldest_timestamp_seconds
              ),
            0
          )
          and
          max without (instance) (
            automata_ci_control_plane_cancellation_intents_oldest_timestamp_seconds
          ) > 0
          and
          cluster:automata_ci_control_plane_cancellation_intents_pending:max > 0

      - record: cluster_state:automata_ci_control_plane_artifacts:max
        expr: >-
          max without (instance) (
            automata_ci_control_plane_artifacts
          )

      - record: cluster_kind:automata_ci_control_plane_artifact_reservations:max
        expr: >-
          max without (instance) (
            automata_ci_control_plane_artifact_reservations
          )

      - record: cluster_kind:automata_ci_control_plane_artifact_reservation_oldest_age_seconds:max
        expr: >-
          clamp_min(
            time()
            - max without (instance) (
                automata_ci_control_plane_artifact_reservation_oldest_timestamp_seconds
              ),
            0
          )
          and
          max without (instance) (
            automata_ci_control_plane_artifact_reservation_oldest_timestamp_seconds
          ) > 0
          and
          cluster_kind:automata_ci_control_plane_artifact_reservations:max > 0

      - record: cluster:automata_ci_runner_slots_configured:sum
        expr: sum without (instance) (automata_ci_runner_slots_configured)

      - record: cluster_state:automata_ci_runner_slots:sum
        expr: sum without (instance) (automata_ci_runner_slots)

      - record: cluster:automata_ci_runner_slot_utilization:ratio
        expr: >-
          sum without (instance, state) (
            automata_ci_runner_slots{state!="idle"}
          )
          /
          clamp_min(
            sum without (instance, state) (
              automata_ci_runner_slots
            ),
            1
          )

      - record: instance_kind:automata_ci_runner_pending_delivery_oldest_age_seconds:max
        expr: >-
          max by (job, cluster, environment, region, instance, kind) (
            clamp_min(
              time()
              - automata_ci_runner_pending_delivery_oldest_timestamp_seconds,
              0
            )
            and
            automata_ci_runner_pending_delivery_oldest_timestamp_seconds > 0
            and
            automata_ci_runner_pending_deliveries > 0
          )

      - record: instance:automata_ci_runner_cgroup_cpu_throttled_period_ratio:rate5m
        expr: >-
          rate(automata_ci_runner_cgroup_cpu_throttled_periods_total[5m])
          /
          clamp_min(
            rate(automata_ci_runner_cgroup_cpu_periods_total[5m]),
            1e-9
          )

  - name: automata-ci-slo
    interval: 30s
    rules:
      - record: job:automata_ci_platform_requests:rate5m
        expr: >-
          sum without (instance, route, method, status_class) (
            rate(automata_ci_control_plane_http_requests_total[5m])
          )

      - record: job:automata_ci_platform_bad_requests:rate5m
        expr: >-
          sum without (instance, route, method, status_class) (
            rate(automata_ci_control_plane_http_requests_total{status_class="5xx"}[5m])
          )

      - record: job:automata_ci_platform_error_ratio:rate5m
        expr: >-
          job:automata_ci_platform_bad_requests:rate5m
          /
          clamp_min(job:automata_ci_platform_requests:rate5m, 1e-9)

      - record: job:automata_ci_platform_error_ratio:rate1h
        expr: >-
          sum without (instance, route, method, status_class) (
            rate(automata_ci_control_plane_http_requests_total{status_class="5xx"}[1h])
          )
          /
          clamp_min(
            sum without (instance, route, method, status_class) (
              rate(automata_ci_control_plane_http_requests_total[1h])
            ),
            1e-9
          )

      - record: cluster:automata_ci_control_plane_lease_queue_wait_seconds:p99_5m
        expr: >-
          histogram_quantile(
            0.99,
            sum without (instance) (
              rate(automata_ci_control_plane_lease_queue_wait_seconds_bucket[5m])
            )
          )

      - record: cluster:automata_ci_control_plane_lease_queue_wait_observations:rate5m
        expr: >-
          sum without (instance) (
            rate(automata_ci_control_plane_lease_queue_wait_seconds_count[5m])
          )
