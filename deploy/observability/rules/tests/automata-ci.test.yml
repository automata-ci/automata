rule_files:
  - ../automata-ci-recording.yml
  - ../automata-ci-alerts.yml

evaluation_interval: 1m

tests:
  - name: mixed HTTP outcomes produce a true error ratio
    interval: 1m
    input_series:
      - series: automata_ci_control_plane_http_requests_total{job="automata-control-plane",instance="cp-1",method="get",route="other",status_class="2xx"}
        values: 0+90x10
      - series: automata_ci_control_plane_http_requests_total{job="automata-control-plane",instance="cp-1",method="get",route="other",status_class="5xx"}
        values: 0+10x10
    promql_expr_test:
      - expr: job:automata_ci_control_plane_http_error_ratio:rate5m
        eval_time: 6m
        exp_samples:
          - labels: '{__name__="job:automata_ci_control_plane_http_error_ratio:rate5m", job="automata-control-plane"}'
            value: 9.999999999999999E-02

  - name: cancelled control attempts are excluded from the failure ratio
    interval: 1m
    input_series:
      - series: automata_ci_runner_control_requests_total{job="automata-runner",instance="runner-1",kind="heartbeat",outcome="success"}
        values: 0+90x10
      - series: automata_ci_runner_control_requests_total{job="automata-runner",instance="runner-1",kind="heartbeat",outcome="cancelled"}
        values: 0+100x10
      - series: automata_ci_runner_control_requests_total{job="automata-runner",instance="runner-1",kind="heartbeat",outcome="timeout"}
        values: 0+10x10
    promql_expr_test:
      - expr: job:automata_ci_runner_control_failure_ratio:rate5m
        eval_time: 6m
        exp_samples:
          - labels: '{__name__="job:automata_ci_runner_control_failure_ratio:rate5m", job="automata-runner"}'
            value: 9.999999999999999E-02

  - name: control-plane target down waits for the page threshold
    interval: 1m
    input_series:
      - series: up{job="automata-control-plane",instance="cp-1"}
        values: 0x10
    alert_rule_test:
      - eval_time: 1m
        alertname: AutomataControlPlaneTargetDown
        exp_alerts: []
      - eval_time: 3m
        alertname: AutomataControlPlaneTargetDown
        exp_alerts:
          - exp_labels:
              alertname: AutomataControlPlaneTargetDown
              instance: cp-1
              job: automata-control-plane
              severity: page
            exp_annotations:
              summary: Automata control-plane metrics target is unavailable
              description: The target cp-1 has failed scrapes for two minutes.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/target-down.md

  - name: independent inventory detects a missing runner Agent
    interval: 1m
    input_series:
      - series: automata_ci_runner_inventory_expected{job="automata-runner",instance="runner-missing",cluster="prod",environment="prod"}
        values: 1x10
    alert_rule_test:
      - eval_time: 6m
        alertname: AutomataRunnerMissingFromInventory
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerMissingFromInventory
              cluster: prod
              environment: prod
              instance: runner-missing
              job: automata-runner
              severity: page
            exp_annotations:
              summary: Expected Automata runner has disappeared from monitoring
              description: Runner inventory identity runner-missing has no current node-local Agent scrape series.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/target-down.md

  - name: failed inventory exporter pages while a healthy peer stays quiet
    interval: 1m
    input_series:
      - series: up{job="automata-runner-inventory",instance="inventory-down"}
        values: 0x10
      - series: up{job="automata-runner-inventory",instance="inventory-healthy"}
        values: 1x10
    alert_rule_test:
      - eval_time: 6m
        alertname: AutomataRunnerInventoryExporterDown
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerInventoryExporterDown
              instance: inventory-down
              job: automata-runner-inventory
              severity: page
            exp_annotations:
              summary: Automata runner inventory monitoring is unavailable
              description: The independent runner inventory exporter has failed or has no discovered target for five minutes.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/target-down.md

  - name: absent inventory exporter discovery pages independently
    interval: 1m
    input_series:
      - series: up{job="automata-control-plane",instance="cp-1"}
        values: 1x10
    alert_rule_test:
      - eval_time: 6m
        alertname: AutomataRunnerInventoryExporterDown
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerInventoryExporterDown
              job: automata-runner-inventory
              severity: page
            exp_annotations:
              summary: Automata runner inventory monitoring is unavailable
              description: The independent runner inventory exporter has failed or has no discovered target for five minutes.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/target-down.md

  - name: empty inventory textfile disables host-loss detection
    interval: 1m
    input_series:
      - series: up{job="automata-runner-inventory",instance="inventory-healthy"}
        values: 1x10
      - series: node_textfile_scrape_error{job="automata-runner-inventory",instance="inventory-healthy"}
        values: 0x10
    alert_rule_test:
      - eval_time: 6m
        alertname: AutomataRunnerInventoryDocumentEmpty
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerInventoryDocumentEmpty
              job: automata-runner
              severity: page
            exp_annotations:
              summary: Automata runner inventory document is empty
              description: The inventory exporter is up but publishes no expected runner identity, disabling whole-host loss detection.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/target-down.md

  - name: nonempty inventory document keeps the empty-document page quiet
    interval: 1m
    input_series:
      - series: up{job="automata-runner-inventory",instance="inventory-healthy"}
        values: 1x10
      - series: automata_ci_runner_inventory_expected{job="automata-runner",instance="runner-present",cluster="prod",environment="prod"}
        values: 1x10
    alert_rule_test:
      - eval_time: 6m
        alertname: AutomataRunnerInventoryDocumentEmpty
        exp_alerts: []

  - name: inventory generation rejects zero old and future timestamps
    interval: 1m
    input_series:
      - series: up{job="automata-runner-inventory",instance="generation-zero"}
        values: 1x15
      - series: up{job="automata-runner-inventory",instance="generation-old"}
        values: 1x15
      - series: up{job="automata-runner-inventory",instance="generation-future"}
        values: 1x15
      - series: up{job="automata-runner-inventory",instance="generation-fresh"}
        values: 1x15
      - series: automata_ci_runner_inventory_generation_timestamp_seconds{job="automata-runner-inventory",instance="generation-zero"}
        values: 0x15
      - series: automata_ci_runner_inventory_generation_timestamp_seconds{job="automata-runner-inventory",instance="generation-old"}
        values: 1x15
      - series: automata_ci_runner_inventory_generation_timestamp_seconds{job="automata-runner-inventory",instance="generation-future"}
        values: 10000x15
      - series: automata_ci_runner_inventory_generation_timestamp_seconds{job="automata-runner-inventory",instance="generation-fresh"}
        values: 0+60x15
    alert_rule_test:
      - eval_time: 9m
        alertname: AutomataRunnerInventoryGenerationStale
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerInventoryGenerationStale
              instance: generation-zero
              job: automata-runner-inventory
              severity: page
            exp_annotations:
              summary: Automata runner inventory generation is stale
              description: Inventory exporter generation-zero has no current generation timestamp, one older than five minutes, or one over sixty seconds in the future.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/target-down.md
          - exp_labels:
              alertname: AutomataRunnerInventoryGenerationStale
              instance: generation-old
              job: automata-runner-inventory
              severity: page
            exp_annotations:
              summary: Automata runner inventory generation is stale
              description: Inventory exporter generation-old has no current generation timestamp, one older than five minutes, or one over sixty seconds in the future.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/target-down.md
          - exp_labels:
              alertname: AutomataRunnerInventoryGenerationStale
              instance: generation-future
              job: automata-runner-inventory
              severity: page
            exp_annotations:
              summary: Automata runner inventory generation is stale
              description: Inventory exporter generation-future has no current generation timestamp, one older than five minutes, or one over sixty seconds in the future.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/target-down.md

  - name: absent inventory generation is detected per healthy exporter
    interval: 1m
    input_series:
      - series: up{job="automata-runner-inventory",instance="generation-missing"}
        values: 1x10
    alert_rule_test:
      - eval_time: 3m
        alertname: AutomataRunnerInventoryGenerationStale
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerInventoryGenerationStale
              instance: generation-missing
              job: automata-runner-inventory
              severity: page
            exp_annotations:
              summary: Automata runner inventory generation is stale
              description: Inventory exporter generation-missing has no current generation timestamp, one older than five minutes, or one over sixty seconds in the future.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/target-down.md

  - name: fresh inventory generation remains healthy
    interval: 1m
    input_series:
      - series: up{job="automata-runner-inventory",instance="generation-fresh"}
        values: 1x10
      - series: automata_ci_runner_inventory_generation_timestamp_seconds{job="automata-runner-inventory",instance="generation-fresh"}
        values: 0+60x10
    alert_rule_test:
      - eval_time: 9m
        alertname: AutomataRunnerInventoryGenerationStale
        exp_alerts: []

  - name: inventory textfile errors page without implicating a healthy peer
    interval: 1m
    input_series:
      - series: node_textfile_scrape_error{job="automata-runner-inventory",instance="inventory-broken"}
        values: 1x10
      - series: node_textfile_scrape_error{job="automata-runner-inventory",instance="inventory-healthy"}
        values: 0x10
    alert_rule_test:
      - eval_time: 3m
        alertname: AutomataRunnerInventoryTextfileError
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerInventoryTextfileError
              instance: inventory-broken
              job: automata-runner-inventory
              severity: page
            exp_annotations:
              summary: Automata runner inventory textfile collection failed
              description: Node exporter inventory-broken cannot parse or read at least one configured textfile document.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/target-down.md

  - name: runner spool warning and critical thresholds are independent
    interval: 1m
    input_series:
      - series: automata_ci_runner_spool_protected_bytes{job="automata-runner",instance="runner-1"}
        values: 96x15
      - series: automata_ci_runner_spool_max_bytes{job="automata-runner",instance="runner-1"}
        values: 100x15
    alert_rule_test:
      - eval_time: 3m
        alertname: AutomataRunnerSpoolCritical
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerSpoolCritical
              instance: runner-1
              job: automata-runner
              severity: page
            exp_annotations:
              summary: Automata runner spool exceeds 95% of a capacity limit
              description: Runner runner-1 is close to rejecting durable output.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/runner-durability.md

  - name: journal bytes and spool objects warn before durable capacity rejection
    interval: 1m
    input_series:
      - series: automata_ci_runner_journal_size_bytes{job="automata-runner",instance="runner-1"}
        values: 96x15
      - series: automata_ci_runner_journal_max_bytes{job="automata-runner",instance="runner-1"}
        values: 100x15
      - series: automata_ci_runner_spool_protected_bytes{job="automata-runner",instance="runner-objects"}
        values: 10x15
      - series: automata_ci_runner_spool_max_bytes{job="automata-runner",instance="runner-objects"}
        values: 100x15
      - series: automata_ci_runner_spool_objects{job="automata-runner",instance="runner-objects"}
        values: 81x15
      - series: automata_ci_runner_spool_max_objects{job="automata-runner",instance="runner-objects"}
        values: 100x15
    alert_rule_test:
      - eval_time: 3m
        alertname: AutomataRunnerJournalCritical
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerJournalCritical
              instance: runner-1
              job: automata-runner
              severity: page
            exp_annotations:
              summary: Automata runner journal exceeds 95% of its byte limit
              description: Runner runner-1 journal is close to rejecting durable state transitions.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/runner-durability.md
      - eval_time: 11m
        alertname: AutomataRunnerJournalNearCapacity
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerJournalNearCapacity
              instance: runner-1
              job: automata-runner
              severity: warning
            exp_annotations:
              summary: Automata runner journal exceeds 80% of its byte limit
              description: Runner runner-1 journal utilization is 96%.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/runner-durability.md
      - eval_time: 11m
        alertname: AutomataRunnerSpoolNearCapacity
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerSpoolNearCapacity
              instance: runner-objects
              job: automata-runner
              severity: warning
            exp_annotations:
              summary: Automata runner spool exceeds 80% of a capacity limit
              description: Runner runner-objects spool byte or object utilization is 81%.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/runner-durability.md

  - name: uncertain journal mutation pages with its finite domain
    interval: 1m
    input_series:
      - series: automata_ci_runner_journal_mutations_total{job="automata-runner",instance="runner-1",domain="log",outcome="uncertain"}
        values: 0+1x8
    alert_rule_test:
      - eval_time: 2m
        alertname: AutomataRunnerJournalUncertainMutation
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerJournalUncertainMutation
              domain: log
              instance: runner-1
              job: automata-runner
              outcome: uncertain
              severity: page
            exp_annotations:
              summary: Automata runner observed an uncertain journal mutation
              description: Runner runner-1 cannot prove the durable outcome of a log mutation.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/runner-durability.md

  - name: cached process and PostgreSQL resource guards join finite gauges
    interval: 1m
    input_series:
      - series: automata_ci_metrics_process_snapshot_healthy{job="automata-control-plane",instance="cp-1"}
        values: 0x15
      - series: automata_ci_control_plane_state_sampler_healthy{job="automata-control-plane",instance="cp-1"}
        values: 0x15
      - series: process_open_fds{job="automata-control-plane",instance="cp-1"}
        values: 91x15
      - series: process_max_fds{job="automata-control-plane",instance="cp-1"}
        values: 100x15
      - series: automata_ci_postgres_pool_connections{job="automata-control-plane",instance="cp-1",state="in_use"}
        values: 91x15
      - series: automata_ci_postgres_pool_max_connections{job="automata-control-plane",instance="cp-1"}
        values: 100x15
    alert_rule_test:
      - eval_time: 2m
        alertname: AutomataControlPlaneStateSamplerUnhealthy
        exp_alerts:
          - exp_labels:
              alertname: AutomataControlPlaneStateSamplerUnhealthy
              instance: cp-1
              job: automata-control-plane
              severity: warning
            exp_annotations:
              summary: Automata durable-state sampling is unhealthy
              description: Replica cp-1 failed its latest durable-state snapshot.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/control-plane.md
      - eval_time: 3m
        alertname: AutomataProcessMetricsSamplerUnhealthy
        exp_alerts:
          - exp_labels:
              alertname: AutomataProcessMetricsSamplerUnhealthy
              instance: cp-1
              job: automata-control-plane
              severity: warning
            exp_annotations:
              summary: Automata process resource sampling is unhealthy
              description: Target cp-1 cannot refresh its cached process resource snapshot.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/process-resources.md
      - eval_time: 11m
        alertname: AutomataProcessFileDescriptorsNearLimit
        exp_alerts:
          - exp_labels:
              alertname: AutomataProcessFileDescriptorsNearLimit
              instance: cp-1
              job: automata-control-plane
              severity: warning
            exp_annotations:
              summary: Automata process file descriptors are near their limit
              description: Target cp-1 has used more than 90% of its file-descriptor limit.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/process-resources.md
      - eval_time: 11m
        alertname: AutomataPostgresPoolNearCapacity
        exp_alerts:
          - exp_labels:
              alertname: AutomataPostgresPoolNearCapacity
              instance: cp-1
              job: automata-control-plane
              severity: warning
            exp_annotations:
              summary: Automata PostgreSQL pool is near capacity
              description: Replica cp-1 has used more than 90% of its configured PostgreSQL connections.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/control-plane.md

  - name: user job failure is not a runner platform alert
    interval: 1m
    input_series:
      - series: automata_ci_runner_jobs_completed_total{job="automata-runner",instance="runner-1",conclusion="failure"}
        values: 0+100x10
      - series: up{job="automata-runner",instance="runner-1"}
        values: 1x10
    alert_rule_test:
      - eval_time: 10m
        alertname: AutomataRunnerTargetDown
        exp_alerts: []
      - eval_time: 10m
        alertname: AutomataRunnerSessionInactive
        exp_alerts: []

  - name: durable lost-attempt maintenance is a platform incident
    interval: 1m
    input_series:
      - series: automata_ci_control_plane_maintenance_work_items_total{job="automata-control-plane",instance="cp-1",kind="lost_attempt"}
        values: 0+1x5
    alert_rule_test:
      - eval_time: 2m
        alertname: AutomataJobAttemptLost
        exp_alerts:
          - exp_labels:
              alertname: AutomataJobAttemptLost
              instance: cp-1
              job: automata-control-plane
              kind: lost_attempt
              severity: page
            exp_annotations:
              summary: Automata declared a job attempt lost
              description: Control-plane maintenance declared at least one job attempt lost in ten minutes.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/queue.md

  - name: atomic slot conservation and durable capacity excess alert independently
    interval: 1m
    input_series:
      - series: automata_ci_runner_slot_snapshot_conserved{job="automata-runner",instance="runner-1"}
        values: 0x10
      - series: automata_ci_runner_slots_over_capacity{job="automata-runner",instance="runner-1"}
        values: 2x10
    alert_rule_test:
      - eval_time: 6m
        alertname: AutomataRunnerSlotAccountingMismatch
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerSlotAccountingMismatch
              instance: runner-1
              job: automata-runner
              severity: warning
            exp_annotations:
              summary: Automata runner slot accounting does not conserve capacity
              description: Runner runner-1 published a non-conserving atomic slot snapshot.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/runner.md
      - eval_time: 6m
        alertname: AutomataRunnerSlotsOverCapacity
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerSlotsOverCapacity
              instance: runner-1
              job: automata-runner
              severity: warning
            exp_annotations:
              summary: Automata runner has durable slots beyond current capacity
              description: Runner runner-1 retains 2 durable slots beyond its configured capacity.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/runner.md

  - name: duplicated queue snapshots aggregate with max
    interval: 1m
    input_series:
      - series: automata_ci_control_plane_queue_jobs{cluster="prod",environment="prod",region="eu",instance="cp-1",state="queued"}
        values: 4x5
      - series: automata_ci_control_plane_queue_jobs{cluster="prod",environment="prod",region="eu",instance="cp-2",state="queued"}
        values: 4x5
    promql_expr_test:
      - expr: cluster_state:automata_ci_control_plane_queue_jobs:max
        eval_time: 2m
        exp_samples:
          - labels: '{__name__="cluster_state:automata_ci_control_plane_queue_jobs:max", cluster="prod", environment="prod", region="eu", state="queued"}'
            value: 4

  - name: empty durable timestamps do not produce epoch-sized ages
    interval: 1m
    input_series:
      - series: automata_ci_control_plane_queue_jobs{cluster="prod",environment="prod",region="eu",instance="cp-1",state="queued"}
        values: 1x5
      - series: automata_ci_control_plane_queue_oldest_timestamp_seconds{cluster="prod",environment="prod",region="eu",instance="cp-1",state="queued"}
        values: 0x5
      - series: automata_ci_control_plane_commands_pending{cluster="prod",environment="prod",region="eu",instance="cp-1"}
        values: 1x5
      - series: automata_ci_control_plane_commands_oldest_timestamp_seconds{cluster="prod",environment="prod",region="eu",instance="cp-1"}
        values: 0x5
    promql_expr_test:
      - expr: cluster_state:automata_ci_control_plane_queue_age_seconds:max
        eval_time: 2m
        exp_samples: []
      - expr: cluster:automata_ci_control_plane_commands_oldest_age_seconds:max
        eval_time: 2m
        exp_samples: []

  - name: runner utilization includes safely retained over-capacity slots
    interval: 1m
    input_series:
      - series: automata_ci_runner_slots_configured{job="automata-runner",cluster="prod",instance="runner-1"}
        values: 2x5
      - series: automata_ci_runner_slots{job="automata-runner",cluster="prod",instance="runner-1",state="running"}
        values: 3x5
      - series: automata_ci_runner_slots{job="automata-runner",cluster="prod",instance="runner-1",state="idle"}
        values: 1x5
    promql_expr_test:
      - expr: cluster:automata_ci_runner_slot_utilization:ratio
        eval_time: 2m
        exp_samples:
          - labels: '{__name__="cluster:automata_ci_runner_slot_utilization:ratio", cluster="prod", job="automata-runner"}'
            value: 0.75

  - name: pending command age is empty-safe and alerts after the threshold
    interval: 1m
    input_series:
      - series: automata_ci_control_plane_commands_pending{cluster="prod",environment="prod",region="eu",instance="cp-1"}
        values: 1x15
      - series: automata_ci_control_plane_commands_oldest_timestamp_seconds{cluster="prod",environment="prod",region="eu",instance="cp-1"}
        values: 60x15
    alert_rule_test:
      - eval_time: 13m
        alertname: AutomataRunnerCommandsPendingTooLong
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerCommandsPendingTooLong
              cluster: prod
              environment: prod
              region: eu
              severity: warning
            exp_annotations:
              summary: Automata runner commands are not being acknowledged
              description: The oldest pending runner command has exceeded five minutes.
              runbook_url: https://github.com/automata-ci/automata/blob/main/deploy/observability/runbooks/control-plane.md

  - name: stale control and clock skew require relevant live runner state
    interval: 1m
    input_series:
      - series: automata_ci_runner_control_last_success_timestamp_seconds{job="automata-runner",instance="runner-active"}
        values: 0x15
      - series: automata_ci_runner_slots{job="automata-runner",instance="runner-active",state="running"}
        values: 1x15
      - series: automata_ci_runner_control_server_clock_offset_seconds{job="automata-runner",instance="runner-active"}
        values: 10x15
      - series: automata_ci_runner_session_connected{job="automata-runner",instance="runner-active"}
        values: 1x15
      - series: automata_ci_runner_control_last_success_timestamp_seconds{job="automata-runner",instance="runner-idle"}
        values: 0x15
      - series: automata_ci_runner_slots{job="automata-runner",instance="runner-idle",state="idle"}
        values: 1x15
      - series: automata_ci_runner_control_server_clock_offset_seconds{job="automata-runner",instance="runner-idle"}
        values: 10x15
      - series: automata_ci_runner_session_connected{job="automata-runner",instance="runner-idle"}
        values: 0x15
    alert_rule_test:
      - eval_time: 3m
        alertname: AutomataRunnerControlStale
        exp_alerts:
          - exp_labels:
              alertname: AutomataRunnerControlStale
              instance: runner-active
              job: automata-runner
              severity: page
            exp_annotations:
              summary: Active Automata runner has stale control progress
              description: Runner runner-active has active work but no recent control success.
