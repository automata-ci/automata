global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 30s

rule_files:
  - rules/automata-ci-recording.yml
  - rules/automata-ci-alerts.yml

scrape_configs:
  - job_name: automata-control-plane
    metrics_path: /metrics
    scheme: http
    scrape_protocols:
      - PrometheusProto
      - OpenMetricsText1.0.0
    scrape_native_histograms: true
    always_scrape_classic_histograms: true
    native_histogram_bucket_limit: 160
    native_histogram_min_bucket_factor: 1.09
    body_size_limit: 2MB
    sample_limit: 5000
    label_limit: 24
    label_name_length_limit: 128
    label_value_length_limit: 256
    file_sd_configs:
      - files:
          - targets/control-plane.json
        refresh_interval: 30s

  - job_name: automata-runner
    metrics_path: /metrics
    scheme: http
    scrape_protocols:
      - PrometheusProto
      - OpenMetricsText1.0.0
    scrape_native_histograms: true
    always_scrape_classic_histograms: true
    native_histogram_bucket_limit: 160
    native_histogram_min_bucket_factor: 1.09
    body_size_limit: 2MB
    sample_limit: 1000
    label_limit: 24
    label_name_length_limit: 128
    label_value_length_limit: 256
    file_sd_configs:
      - files:
          - targets/runners.json
        refresh_interval: 30s

  # Scrape the node_exporter textfile collector fed by the independent runner
  # inventory renderer. The endpoint MUST be a dedicated node_exporter started
  # with --collector.disable-defaults --collector.textfile and an inventory-only
  # --collector.textfile.directory. The 2MB body limit is applied before metric
  # relabeling, so sharing the endpoint with default collectors can reject a
  # valid maximum-size inventory. honor_labels preserves each expected runner's
  # exported job/instance identity instead of replacing it with this target.
  - job_name: automata-runner-inventory
    metrics_path: /metrics
    scheme: http
    honor_labels: true
    scrape_protocols:
      - OpenMetricsText1.0.0
      - PrometheusText0.0.4
    body_size_limit: 2MB
    sample_limit: 10002
    target_limit: 1
    label_limit: 24
    label_name_length_limit: 128
    label_value_length_limit: 256
    metric_relabel_configs:
      - source_labels:
          - __name__
        regex: automata_ci_runner_inventory_expected|automata_ci_runner_inventory_generation_timestamp_seconds|node_textfile_scrape_error
        action: keep
    file_sd_configs:
      - files:
          - targets/inventory-exporter.json
        refresh_interval: 30s
