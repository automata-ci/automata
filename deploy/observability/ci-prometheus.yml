global:
  scrape_interval: 1s
  scrape_timeout: 500ms
  evaluation_interval: 1s

rule_files:
  - rules/metrics-contract.yml

scrape_configs:
  - job_name: metrics-contract
    metrics_path: /metrics
    scheme: http
    scrape_protocols:
      - OpenMetricsText1.0.0
    body_size_limit: 2MB
    sample_limit: 1000
    label_limit: 24
    label_name_length_limit: 128
    label_value_length_limit: 256
    static_configs:
      - targets:
          - 127.0.0.1:19464
