name: Pull request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTOMATA_BUILD_GIT_SHA: ${{ github.sha }}
  AUTOMATA_EXPECTED_GIT_SHA: ${{ github.sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  SCCACHE_BASEDIRS: ${{ github.workspace }}
  SCCACHE_IDLE_TIMEOUT: "0"
  SCCACHE_SERVER_UDS: '\x00automata-sccache'
  TMPDIR: ${{ github.workspace }}/target/task-tmp/pr

jobs:
  critical_rust:
    name: Critical Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=lld
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare job scratch directory
        run: install -d -m 0700 -- "$TMPDIR"

      - name: Configure shared Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Start Rust compiler cache
        run: env TMPDIR=/tmp sccache --start-server

      - name: Restore Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
          key: cargo-ubuntu-24.04-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-ubuntu-24.04-rust-1.97.1-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test the critical execution path
        run: >-
          cargo test
          --locked
          --all-features
          --lib
          --no-fail-fast
          -p automata-ci-control
          -p automata-ci-core
          -p automata-ci-github-delivery
          -p automata-ci-job-executor-github
          -p automata-ci-results-github
          -p automata-ci-runner-runtime
          -p automata-ci-sandbox-podman
          -p automata-ci-store-postgres
          -p automata-ci-workflow-github
          -p automata-ci-workflow-service

      - name: Validate workflow syntax
        run: |
          ./scripts/ci/install-actionlint.sh target/ci-tools
          target/ci-tools/actionlint .ci/workflows/*.yml

      - name: Verify Windows CI contract
        run: python3 scripts/ci/tests/windows-rust-ci.test.py

  frontend:
    name: Critical frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Test and build the frontend
        run: npm run check

  windows:
    name: Windows sandbox and runner boundary
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Restore Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
          key: cargo-windows-2025-msvc-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-windows-2025-msvc-rust-1.97.1-

      - name: Show pinned Windows MSVC toolchain
        run: |
          New-Item -ItemType Directory -Force -Path $env:TMPDIR | Out-Null
          rustc --version --verbose
          cargo --version --verbose
          $rustHostTriple = (
            rustc --version --verbose |
              Select-String -Pattern '^host: ' |
              ForEach-Object { $_.Line.Substring(6) }
          )
          if ($rustHostTriple -ne 'x86_64-pc-windows-msvc') {
            throw "expected x86_64-pc-windows-msvc, got $rustHostTriple"
          }

      - name: Compile Windows sandbox and runner boundary
        run: >-
          cargo check
          --locked
          -p automata-ci-sandbox-windows
          -p automata-ci-runner
          --all-targets
          --all-features
          --target x86_64-pc-windows-msvc

      - name: Lint Windows sandbox and runner boundary
        run: >-
          cargo clippy
          --locked
          -p automata-ci-sandbox-windows
          -p automata-ci-runner
          --all-targets
          --all-features
          --target x86_64-pc-windows-msvc
          --no-deps
          --
          -D warnings

      - name: Test Windows sandbox boundary
        run: >-
          cargo test
          --locked
          -p automata-ci-sandbox-windows
          --all-targets
          --all-features
          --target x86_64-pc-windows-msvc

      - name: Test Windows runner boundary
        run: |
          cargo test --locked `
            -p automata-ci-runner `
            --lib `
            --target x86_64-pc-windows-msvc `
            windows_tests
          cargo test --locked `
            -p automata-ci-runner `
            --test runner `
            --target x86_64-pc-windows-msvc `
            'runner_product_config_windows::'
