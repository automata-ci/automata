name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTOMATA_BUILD_GIT_SHA: ${{ github.sha }}
  AUTOMATA_EXPECTED_GIT_SHA: ${{ github.sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  SCCACHE_BASEDIRS: ${{ github.workspace }}
  SCCACHE_GHA_CACHE_FROM: automata-rust-v1
  SCCACHE_GHA_CACHE_TO: automata-rust-v1
  SCCACHE_IDLE_TIMEOUT: "0"
  SCCACHE_SERVER_UDS: /tmp/automata-sccache.sock
  TMPDIR: ${{ github.workspace }}/target/task-tmp/ci

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    resources:
      limits:
        cpu: "4"
        memory: 5Gi
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=lld
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare build directory
        run: install -d -m 0700 -- "$TMPDIR"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Restore Cargo cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            /opt/cargo/registry/cache
            /opt/cargo/registry/index
            /opt/cargo/registry/src
          key: cargo-v1-ubuntu-24.04-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-v1-ubuntu-24.04-rust-1.97.1-

      - name: Run Rust checks
        run: |
          cargo fmt --all -- --check
          ./scripts/ci/install-actionlint.sh target/ci-tools
          ./scripts/ci/lint-workflows.sh
          cargo clippy --workspace --lib --bins --all-features --locked -- -D warnings
          cargo test \
            --locked \
            --all-features \
            --lib \
            --no-fail-fast \
            -p automata-ci-control \
            -p automata-ci-core \
            -p automata-ci-github-delivery \
            -p automata-ci-job-executor-github \
            -p automata-ci-results-github \
            -p automata-ci-runner-runtime \
            -p automata-ci-sandbox-podman \
            -p automata-ci-store-postgres \
            -p automata-ci-ui-renderer \
            -p automata-ci-workflow-github \
            -p automata-ci-workflow-service

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    resources:
      limits:
        cpu: "4"
        memory: 4Gi
    services:
      postgres:
        image: docker.io/library/postgres@sha256:7e6103cf85f88f7a0eddb3ec0b1ba8940eba098ed118ade25a729ca9daee5568
        env:
          POSTGRES_DB: automata_ci
          POSTGRES_PASSWORD: automata-ci-local-only
          POSTGRES_USER: automata_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --dbname=automata_ci --username=automata_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      AUTOMATA_TEST_DATABASE_URL: postgresql://automata_ci:automata-ci-local-only@127.0.0.1:5432/automata_ci
      AUTOMATA_TEST_DATABASE_NAMESPACE: ci_${{ github.run_id }}_${{ github.run_attempt }}
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=lld
      RUST_TEST_THREADS: "2"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare build directory
        run: install -d -m 0700 -- "$TMPDIR"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Restore Cargo cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            /opt/cargo/registry/cache
            /opt/cargo/registry/index
            /opt/cargo/registry/src
          key: cargo-v1-ubuntu-24.04-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-v1-ubuntu-24.04-rust-1.97.1-

      - name: Run PostgreSQL tests
        run: ./scripts/ci/run-postgres-tests.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Test and build frontend
        run: |
          npm ci --no-audit --prefer-offline
          npm run check
