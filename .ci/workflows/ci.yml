name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTOMATA_BUILD_GIT_SHA: ${{ github.sha }}
  AUTOMATA_EXPECTED_GIT_SHA: ${{ github.sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  SCCACHE_BASEDIRS: ${{ github.workspace }}
  SCCACHE_GHA_CACHE_FROM: automata-rust-v1
  SCCACHE_GHA_CACHE_TO: automata-rust-v1
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    resources:
      limits:
        cpu: "4"
        memory: 8Gi
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=lld
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install sccache
        run: ./scripts/ci/install-sccache.sh

      - name: Run Rust and CI checks
        run: |
          cargo fmt --all -- --check
          ./scripts/ci/install-actionlint.sh target/ci-tools
          ./scripts/ci/install-zizmor.sh target/ci-tools
          ./scripts/ci/lint-workflows.sh
          ./scripts/ci/lint-ci-security.sh
          python3 scripts/ci/tests/macos-integration-checks.test.py
          python3 scripts/ci/tests/macos-physical-checks.test.py
          python3 scripts/ci/tests/windows-image-pipeline.test.py
          cargo clippy --workspace --lib --bins --all-features --locked -- -D warnings
          cargo test \
            --locked \
            --all-features \
            --lib \
            --no-fail-fast \
            -p automata-ci-control \
            -p automata-ci-core \
            -p automata-ci-github-delivery \
            -p automata-ci-job-executor-actions \
            -p automata-ci-runner-results \
            -p automata-ci-runner-runtime \
            -p automata-ci-sandbox-podman \
            -p automata-ci-store-postgres \
            -p automata-ci-ui-renderer \
            -p automata-ci-workflow-actions \
            -p automata-ci-workflow-service

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    resources:
      limits:
        cpu: "4"
        memory: 8Gi
    services:
      postgres:
        image: docker.io/library/postgres@sha256:7e6103cf85f88f7a0eddb3ec0b1ba8940eba098ed118ade25a729ca9daee5568
        env:
          POSTGRES_DB: automata_ci
          POSTGRES_PASSWORD: automata-ci-local-only
          POSTGRES_USER: automata_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --dbname=automata_ci --username=automata_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      AUTOMATA_TEST_DATABASE_URL: postgresql://automata_ci:automata-ci-local-only@127.0.0.1:5432/automata_ci
      AUTOMATA_TEST_DATABASE_NAMESPACE: ci_${{ github.run_id }}_${{ github.run_attempt }}
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=lld
      RUST_TEST_THREADS: "4"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install sccache
        run: ./scripts/ci/install-sccache.sh

      - name: Run PostgreSQL tests
        run: ./scripts/ci/run-postgres-tests.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Test and build frontend
        run: |
          test "$(node --version)" = "v24.19.0"
          npm ci --no-audit --prefer-offline
          npx --no-install playwright install --with-deps chromium
          npm run check
