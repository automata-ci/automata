name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTOMATA_BUILD_GIT_SHA: ${{ github.sha }}
  AUTOMATA_EXPECTED_GIT_SHA: ${{ github.sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  TMPDIR: ${{ github.workspace }}/target/task-tmp/ci

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Show pinned toolchain
        run: |
          install -d -m 0700 -- "$TMPDIR"
          rustc --version --verbose
          cargo --version --verbose

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq shellcheck

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify crate publication tooling
        run: |
          python3 scripts/ci/publish-crates.py --list-publishable >/dev/null
          python3 scripts/ci/tests/publish-crates.test.py
          ./scripts/dev/create-integration-snapshot.test.sh

      - name: Lint workflows and shell scripts
        run: |
          ./scripts/ci/install-actionlint.sh target/ci-tools
          target/ci-tools/actionlint .ci/workflows/*.yml
          shellcheck -x \
            scripts/install.sh \
            scripts/ci/*.sh \
            scripts/ci/lib/*.sh \
            scripts/ci/tests/*.sh \
            scripts/dev/*.sh \
            deploy/observability/inventory/*.sh \
            images/github-hosted-ubuntu-24.04-x64/*.sh \
            scripts/ui/*.sh \
            scripts/ui/tests/*.sh \
            crates/automata-ci-protocol-protobuf/tools/*.sh
          ./scripts/ui/tests/renderer-profile-launcher.contract.sh
          ./scripts/ui/tests/regenerate-renderer-atomicity.test.sh
          ./scripts/ui/tests/renderer-preflight.test.sh
          ./scripts/ui/tests/renderer-provenance.test.sh
          ./deploy/observability/inventory/inventory-scratch.test.sh
          ./scripts/dev/git-bridge-firewall.test.sh
          ./scripts/dev/results-firewall.test.sh
          ./scripts/dev/git-http-server.test.sh
          ./scripts/ci/tests/benchmark-postgres-tests.test.sh
          python3 scripts/ci/tests/psql-test-database.test.py
          ./scripts/ci/tests/container-context.test.sh
          ./scripts/ci/tests/install.test.sh
          python3 scripts/ci/tests/release-handoff.test.py
          python3 scripts/ci/tests/rust-coverage.test.py
          python3 scripts/ci/tests/service-proxy-candidate.test.py

      - name: Verify Prometheus metrics contract
        env:
          AUTOMATA_METRICS_CONTAINER_RUNTIME: docker
        run: ./scripts/ci/verify-metrics.sh

      - name: Verify native Prometheus metrics contract
        env:
          AUTOMATA_METRICS_CONTAINER_RUNTIME: docker
        run: ./scripts/ci/verify-native-metrics.sh

      - name: Lint
        run: |
          trap 'df -h -- "$GITHUB_WORKSPACE"; du -sh -- target 2>/dev/null || true' EXIT
          df -h -- "$GITHUB_WORKSPACE"
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Test workspace documentation
        run: cargo test --workspace --exclude automata-ci-ui-renderer --doc --all-features --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Test vendored renderer macro diagnostics
        run: ./scripts/ui/tests/rquickjs-macro-diagnostics.test.sh

      - name: Audit dependencies
        run: |
          cargo deny --locked --workspace --all-features check advisories bans licenses sources
          crates/automata-ci-protocol-protobuf/tools/protobuf-codegen.sh audit

  rust_coverage:
    name: Rust coverage and PostgreSQL invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: docker.io/library/postgres:18.4-bookworm@sha256:7e6103cf85f88f7a0eddb3ec0b1ba8940eba098ed118ade25a729ca9daee5568
        env:
          POSTGRES_DB: automata_ci
          POSTGRES_PASSWORD: automata-ci-local-only
          POSTGRES_USER: automata_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --dbname=automata_ci --username=automata_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AUTOMATA_TEST_DATABASE_URL: postgresql://automata_ci:automata-ci-local-only@127.0.0.1:5432/automata_ci
      AUTOMATA_TEST_DATABASE_NAMESPACE: ci_${{ github.run_id }}_${{ github.run_attempt }}
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare job scratch directory
        run: install -d -m 0700 -- "$TMPDIR"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Verify PostgreSQL 18.4
        env:
          PGPASSWORD: automata-ci-local-only
        run: ./scripts/ci/verify-postgres-version.sh

      - name: Install pinned Rust coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Test Rust workspace and PostgreSQL invariants
        run: |
          trap 'df -h -- "$GITHUB_WORKSPACE"; du -sh -- target 2>/dev/null || true' EXIT
          df -h -- "$GITHUB_WORKSPACE"
          ./scripts/ci/run-rust-coverage.sh target/coverage/rust ordinary postgres

      - name: Upload service-aware Rust coverage report
        if: ${{ always() && hashFiles('target/coverage/rust/manifest.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-ordinary
          path: |
            target/coverage/rust/coverage.lcov
            target/coverage/rust/manifest.json
            target/coverage/rust/summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload combined Rust and PostgreSQL coverage report
        if: ${{ always() && hashFiles('target/coverage/rust/combined-manifest.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-ordinary-postgres
          path: |
            target/coverage/rust/combined-coverage.lcov
            target/coverage/rust/combined-manifest.json
            target/coverage/rust/combined-summary.json
          if-no-files-found: error
          retention-days: 14

  renderer_tests:
    name: Rust renderer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare job scratch directory
        run: install -d -m 0700 -- "$TMPDIR"

      - name: Test Rust renderer
        run: |
          trap 'df -h -- "$GITHUB_WORKSPACE"; du -sh -- target 2>/dev/null || true' EXIT
          df -h -- "$GITHUB_WORKSPACE"
          cargo test -p automata-ci-ui-renderer --all-targets --all-features --locked
          cargo test -p automata-ci-ui-renderer --doc --all-features --locked

  frontend:
    name: React SSR frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Prepare job scratch directory
        run: install -d -m 0700 -- "$TMPDIR"

      - name: Install locked frontend dependencies
        run: npm ci --no-audit

      - name: Audit frontend dependencies
        run: npm audit --audit-level=low

      - name: Verify and build server-rendered frontend
        run: |
          npm run test:build-verifier
          npm run build

      - name: Enforce frontend coverage thresholds
        run: npm run test:coverage

      - name: Verify embedded renderer provenance
        working-directory: .
        run: ./scripts/ui/verify-renderer-assets.sh ui/dist

      - name: Test deterministic SBOM normalization
        working-directory: .
        run: node --test scripts/ci/tests/*.test.mjs

  renderer:
    name: Reproduce embedded renderer
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reproduce embedded renderer component and assets
        run: |
          ./scripts/ui/reproduce-renderer-in-profile.sh
          git diff --exit-code -- \
            crates/automata-ci-ui-renderer/assets \
            crates/automata-ci-ui-renderer/src/generated_assets.rs \
            ui/renderer

  dist_build:
    name: Build static Linux distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read workspace version
        run: |
          version="$(./scripts/ci/workspace-version.sh)"
          {
            printf 'AUTOMATA_EXPECTED_VERSION=%s\n' "$version"
            printf 'AUTOMATA_RELEASE_CREATED=%s\n' "$(git show -s --format=%cI HEAD)"
            printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_ENV"

      - name: Install musl and ELF tooling
        run: |
          install -d -m 0700 -- "$TMPDIR"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils musl-tools podman

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install pinned SBOM generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Build distribution binaries
        env:
          AUTOMATA_RELEASE_BUILD: "1"
        run: ./scripts/ci/build-static-musl.sh

      - name: Verify static binaries
        env:
          AUTOMATA_SCRATCH_RUNTIME: docker
        run: |
          ./scripts/ci/verify-static-musl.sh
          ./scripts/ci/verify-service-proxy-static.sh

      - name: Generate binary and embedded-runtime SBOMs
        run: ./scripts/ci/generate-sboms.sh

      - name: Prepare locked third-party license sources
        run: ./scripts/ci/prepare-third-party-license-sources.sh

      - name: Generate and reproduce third-party notices offline
        run: |
          ./scripts/ci/generate-third-party-licenses.sh
          ./scripts/ci/generate-third-party-licenses.sh \
            target/third-party-license-reproduction
          diff --recursive --brief \
            target/distribution-input/licenses \
            target/third-party-license-reproduction

      - name: Package and reproduce deterministic distribution
        run: |
          ./scripts/ci/package-static-musl.sh
          cp \
            "target/distribution/automata-x86_64-unknown-linux-musl.tar.gz.sha256" \
            target/distribution-first.sha256
          ./scripts/ci/package-static-musl.sh
          cmp \
            target/distribution-first.sha256 \
            "target/distribution/automata-x86_64-unknown-linux-musl.tar.gz.sha256"

      - name: Prepare digest-bound private service-proxy image candidate
        env:
          AUTOMATA_SERVICE_PROXY_CONTAINER_RUNTIME: podman
        run: |
          ./scripts/ci/prepare-service-proxy-context.sh \
            target/service-proxy-context \
            "$AUTOMATA_EXPECTED_VERSION" \
            "$AUTOMATA_EXPECTED_GIT_SHA" \
            "$AUTOMATA_RELEASE_CREATED" \
            "$SOURCE_DATE_EPOCH"
          ./scripts/ci/build-service-proxy-candidate.sh \
            target/service-proxy-context \
            target/service-proxy-publication
          ./scripts/ci/build-service-proxy-candidate.sh \
            target/service-proxy-context \
            target/service-proxy-publication-reproduction
          cmp \
            target/service-proxy-publication/automata-service-proxy-candidate-x86_64-unknown-linux-musl.tar \
            target/service-proxy-publication-reproduction/automata-service-proxy-candidate-x86_64-unknown-linux-musl.tar
          python3 scripts/ci/service-proxy-publication.py prepare-candidate \
            --candidate target/service-proxy-publication/automata-service-proxy-candidate-x86_64-unknown-linux-musl.tar \
            --source-directory "$GITHUB_WORKSPACE" \
            --candidate-commit "$GITHUB_SHA" \
            --publisher-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output target/service-proxy-policy-review

      - name: Upload unpublished service-proxy image candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automata-service-proxy-candidate-x86_64-unknown-linux-musl
          path: target/service-proxy-publication/automata-service-proxy-candidate-x86_64-unknown-linux-musl.tar
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload bootstrap distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automata-x86_64-unknown-linux-musl
          path: |
            target/distribution/*.tar.gz
            target/distribution/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  dist:
    name: Static Linux distribution
    if: ${{ !cancelled() }}
    needs:
      - dist_build
      - verify
      - rust_coverage
      - renderer_tests
      - frontend
      - renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Admit the validated distribution candidate
        env:
          DIST_BUILD_RESULT: ${{ needs.dist_build.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          RUST_COVERAGE_RESULT: ${{ needs.rust_coverage.result }}
          RENDERER_TESTS_RESULT: ${{ needs.renderer_tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RENDERER_RESULT: ${{ needs.renderer.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [[ "$DIST_BUILD_RESULT" == success ]]
          [[ "$VERIFY_RESULT" == success ]]
          [[ "$RUST_COVERAGE_RESULT" == success ]]
          [[ "$RENDERER_TESTS_RESULT" == success ]]
          [[ "$FRONTEND_RESULT" == success ]]
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$RENDERER_RESULT" == success || "$RENDERER_RESULT" == skipped ]]
          else
            [[ "$RENDERER_RESULT" == success ]]
          fi
          [[ "$AUTOMATA_EXPECTED_GIT_SHA" == "$GITHUB_SHA" ]]
          printf 'validated distribution candidate %s\n' "$GITHUB_SHA"
