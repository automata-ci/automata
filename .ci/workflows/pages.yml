name: UI demo screenshots

on:
  pull_request:
    paths:
      - ".ci/workflows/pages.yml"
      - "crates/automata-ci-ui-renderer/contract.json"
      - "ui/**"
  push:
    branches:
      - main
    paths:
      - ".ci/workflows/pages.yml"
      - "crates/automata-ci-ui-renderer/contract.json"
      - "ui/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Automata owns the portable build and screenshot checks. Protected GitHub
# Pages deployment is intentionally omitted until Automata supports GitHub
# deployment environments end to end; this repository must have one workflow
# authority and therefore cannot also contain .github/workflows.
# Live probe: verify the redundant control plane and six-runner fleet after the
# runtime-permission correction.
jobs:
  build:
    name: Build demo and capture screenshots
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare task scratch directory
        env:
          TMPDIR: ${{ github.workspace }}/target/task-tmp/pages
        run: install -d -m 0700 -- "$TMPDIR"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install locked demo dependencies
        working-directory: ui
        env:
          TMPDIR: ${{ github.workspace }}/target/task-tmp/pages
        run: npm ci --no-audit

      - name: Install Chromium
        working-directory: ui
        env:
          TMPDIR: ${{ github.workspace }}/target/task-tmp/pages
        run: npx --no-install playwright install --with-deps chromium

      - name: Build demo and capture theme-aware screenshots
        working-directory: ui
        env:
          TMPDIR: ${{ github.workspace }}/target/task-tmp/pages
        run: npm run screenshots

      - name: Upload screenshot review artifact
        if: ${{ always() && hashFiles('ui/dist/preview/screenshots/*.png') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screenshots
          path: ui/dist/preview/screenshots
          if-no-files-found: error
          retention-days: 14
